  <style>
    :root {
      --bg:#000000; --surface:#0a0a0a; --raised:#111111; --border:#1a1a1a; --border-hi:#333333;
      --text:#ffffff; --muted:#b0b0b0; --dim:#666666;
      --accent:#ffffff; --accent-glow:rgba(255,255,255,0.08);
      --danger:#ff3333; --danger-bg:#160000; --danger-bdr:#380000;
      --warn:#ff8800; --warn-bg:#1a0e00; --warn-bdr:#3a2000;
      --good:#33cc66; --good-bg:#001a0d; --good-bdr:#004d20;
    }
    body.light-mode {
      --bg:#f5f5f5; --surface:#ffffff; --raised:#ebebeb; --border:#d4d4d4; --border-hi:#aaaaaa;
      --text:#111111; --muted:#555555; --dim:#888888;
      --accent:#111111; --accent-glow:rgba(0,0,0,0.06);
      --danger:#cc2222; --danger-bg:#fff0f0; --danger-bdr:#e8a0a0;
      --warn:#c45500; --warn-bg:#fff5e6; --warn-bdr:#e0b080;
      --good:#1a7a30; --good-bg:#edf7ef; --good-bdr:#90c8a0;
    }
    body { margin:0; padding:0; background:var(--bg); font-family:'DM Mono','Courier New',monospace; color:var(--text); }

    /* Starlink-style scrollbar */
    ::-webkit-scrollbar { width:4px; height:4px; background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--border-hi); border-radius:2px; }
    ::-webkit-scrollbar-track { background:transparent; }
    * { box-sizing:border-box; }
    input::placeholder { color:var(--dim); }
    textarea::placeholder { color:var(--dim); }

    /* Account row mobile responsive */
    .acct-row-header{display:flex;align-items:center;padding:11px 20px;cursor:pointer;gap:14px;flex-wrap:nowrap;transition:background 0.15s;}
    .acct-info{flex:1;min-width:0;}
    .acct-stats{display:flex;align-items:center;gap:10px;flex-shrink:0;}
    .acct-stat{text-align:right;}
    .acct-stat-rev{min-width:72px;}
    .acct-stat-skus{min-width:60px;}
    .acct-badge-col{min-width:110px;text-align:right;}
    @media(max-width:600px){
      .acct-row-header{flex-wrap:wrap;padding:12px 14px;gap:6px;}
      .acct-info{width:calc(100% - 24px);}
      .acct-stats{width:100%;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:4px;}
      .acct-stat{text-align:left;}
      .acct-stat-rev,.acct-stat-skus,.acct-badge-col{min-width:0;text-align:left;}
      .acct-stat-label{font-size:8px;}
      .acct-stat-value{font-size:13px;}
    }

    /* ═══ MOBILE: Clean, comprehensive, no bleeding ═══ */

    /* Safety net: nothing wider than viewport */
    html,body{overflow-x:hidden;}
    .gpi-content{box-sizing:border-box;}
    .gpi-content *{max-width:100vw;}

    @media(max-width:768px){
      /* Header */
      .gpi-header{padding:0 12px !important;height:48px !important;}
      .gpi-header img{height:28px !important;}
      .gpi-header .hdr-actions{gap:4px !important;}
      .gpi-header .hdr-actions button,
      .gpi-header .hdr-actions label{font-size:7px !important;padding:3px 6px !important;letter-spacing:0.5px !important;}
      /* Tab bar: horizontal scroll */
      .gpi-tab-bar{padding:0 8px !important;gap:0 !important;-webkit-overflow-scrolling:touch;scroll-behavior:smooth;}
      .gpi-tab-bar::after{content:'';position:sticky;right:0;min-width:24px;background:linear-gradient(to right,transparent,var(--bg,#000));pointer-events:none;flex-shrink:0;}
      .gpi-tab-bar button{font-size:8px !important;padding:10px 6px !important;white-space:nowrap;letter-spacing:0.5px !important;}
      /* Content area */
      .gpi-content{padding:10px 8px !important;overflow-x:hidden !important;}
      /* Tables: compact */
      .gpi-content table{font-size:10px !important;min-width:0 !important;}
      .gpi-content th,.gpi-content td{padding:5px 6px !important;font-size:9px !important;}
      .gpi-content table input,.gpi-content table select{font-size:10px !important;}
      /* Buttons: smaller */
      .gpi-content button{font-size:9px !important;}
      /* SVG/canvas: contain */
      .gpi-content svg{max-width:100% !important;height:auto !important;}
    }

    @media(max-width:640px){
      /* Grid stacking */
      .gpi-zone-grid{grid-template-columns:1fr !important;}
      .gpi-form-grid{grid-template-columns:1fr 1fr !important;}
      .gpi-form-row{grid-template-columns:1fr 1fr !important;}
      .gpi-twocol{grid-template-columns:1fr !important;}
      /* Force ALL inline grids to 2 columns max on mobile */
      /* Tables: remove all minWidth */
      .gpi-content table{min-width:0 !important;width:100% !important;}
      /* Wrap long text */
      .gpi-content td,.gpi-content th{white-space:normal !important;word-break:break-word;}
      /* Cards: no overflow clipping */
      .gpi-content > div > div{overflow:visible !important;}
    }

    @media(max-width:480px){
      .gpi-tab-bar button{font-size:7px !important;padding:8px 4px !important;}
      .gpi-content{padding:8px 6px !important;}
      .gpi-content th,.gpi-content td{padding:4px 4px !important;font-size:8px !important;}
      .gpi-content table input{width:55px !important;}
      .gpi-content table select{width:65px !important;}
      /* Stat card text */
      .gpi-content div[style]{font-size:inherit;}
    }

    @media(max-width:400px){
      .gpi-content th,.gpi-content td{padding:3px 3px !important;font-size:7px !important;}
      .gpi-tab-bar button{font-size:6px !important;padding:6px 3px !important;}
    }

    /* Missile arc animation */
    @keyframes dash {
      to { stroke-dashoffset: 0; }
    }
    @keyframes pulse-dot {
      0%,100% { r:4; opacity:1; }
      50% { r:7; opacity:0.6; }
    }
    @keyframes map-fade-out {
      0% { opacity:1; transform:scale(1); }
      70% { opacity:1; transform:scale(1); }
      100% { opacity:0; transform:scale(0.96); }
    }
    @keyframes float-up {
      0% { opacity:0; transform:translateY(10px); }
      100% { opacity:1; transform:translateY(0); }
    }
    .map-screen { animation: map-fade-out 6s ease-in-out forwards; }
    .dispatch-arc { animation: dash 2s ease-out forwards; }
    .zone-pulse { animation: pulse-dot 1.5s ease-in-out infinite; }
    .fade-in { animation: float-up 0.5s ease-out forwards; }
    @keyframes popIn { 0%{opacity:0;transform:scale(0)} 60%{opacity:1;transform:scale(1.3)} 100%{opacity:1;transform:scale(1)} }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    @keyframes pulseGlow { 0%,100%{filter:drop-shadow(0 0 2px var(--glow))} 50%{filter:drop-shadow(0 0 6px var(--glow))} }

    /* Theme toggle */
    .theme-toggle { background:none; border:1px solid var(--border-hi); border-radius:20px; padding:4px 12px; cursor:pointer; font-size:10px; color:var(--muted); font-family:inherit; letter-spacing:1px; transition:all 0.2s; }
    .theme-toggle:hover { border-color:var(--text); color:var(--text); }
  </style>

  <!-- localStorage shim — replaces Claude's window.storage API -->
  <script>
    var PFX = 'gpi:';
    window.storage = {
      get: async function(key) {
        try { var v = localStorage.getItem(PFX+key); return v ? { key:key, value:v } : null; } catch(e) { return null; }
      },
      set: async function(key, value) {
        try { localStorage.setItem(PFX+key, value); return { key:key, value:value }; } catch(e) { return null; }
      },
      delete: async function(key) {
        try { localStorage.removeItem(PFX+key); return { key:key, deleted:true }; } catch(e) { return null; }
      },
      list: async function(prefix) {
        try {
          var keys = Object.keys(localStorage)
            .filter(function(k){ return k.startsWith(PFX+(prefix||'')); })
            .map(function(k){ return k.slice(PFX.length); });
          return { keys:keys };
        } catch(e) { return { keys:[] }; }
      }
    };
  </script>

    function parseCSVRFC4180(text) {
      const rows = []; let row = [], field = "", inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (inQuotes) {
          if (ch === '"' && text[i+1] === '"') { field += '"'; i++; }
          else if (ch === '"') inQuotes = false;
          else field += ch;
        } else {
          if (ch === '"') inQuotes = true;
          else if (ch === ',') { row.push(field.trim()); field = ""; }
          else if (ch === '\r' && text[i+1] === '\n') { i++; row.push(field.trim()); rows.push(row); row = []; field = ""; }
          else if (ch === '\n' || ch === '\r') { row.push(field.trim()); rows.push(row); row = []; field = ""; }
          else field += ch;
        }
      }
      if (field || row.length > 0) { row.push(field.trim()); rows.push(row); }
      return rows.filter(r => r.some(c => c.length > 0));
    }

    function getQuarter(d) {
      if (!d) return null;
      const dt = new Date(d); if (isNaN(dt.getTime())) return null;
      return "Q" + Math.ceil((dt.getMonth()+1)/3) + " " + dt.getFullYear();
    }
    function quarterOrder(q) { const m = q && q.match(/Q(\d) (\d{4})/); return m ? parseInt(m[2])*10+parseInt(m[1]) : 0; }

    function parseAccountActivityCSV(text) {
      const all = parseCSVRFC4180(text); if (!all.length) return [];
      const hi = all.findIndex(r => r.some(c => c.toLowerCase().replace(/\n/g," ").includes("related account")));
      if (hi < 0) return [];
      const hdr = all[hi].map(h => h.toLowerCase().replace(/\n/g," ").trim());
      const ci = function(kw) { return hdr.findIndex(h => h.includes(kw)); };
      const COL = { conf:0, acc:ci("related account"), allLoc:ci("all locations"), ev:6, sd:4, ed:5, rep:ci("sales rep"), zone:ci("zone"), sales:ci("total sales"), months:ci("number of month"), pct:ci("% off"), req:19 };
      const accs = {};
      all.slice(hi+1).forEach(function(row) {
        if (row.length < 10) return;
        const name = row[COL.acc] && row[COL.acc].trim(); if (!name || name.length < 2) return;
        const rep = (row[COL.rep] && row[COL.rep].trim()) || "";
        const zone = (row[COL.zone] && row[COL.zone].trim()) || "";
        const allLocs = row[COL.allLoc] && row[COL.allLoc].trim().toUpperCase() === "TRUE";
        const sales = parseFloat((row[COL.sales] || "").replace(/[$,"]/g,"").trim()) || 0;
        const months = parseFloat((row[COL.months] || "").replace(/,/g,"").trim()) || 0;
        const promo = {
          confirmation: (row[COL.conf] && row[COL.conf].trim()) || "",
          event: (row[COL.ev] && row[COL.ev].trim()) || "",
          startDate: (row[COL.sd] && row[COL.sd].trim()) || "",
          endDate: (row[COL.ed] && row[COL.ed].trim()) || "",
          pctOff: (row[COL.pct] && row[COL.pct].trim()) || "",
          reqDays: (row[COL.req] && row[COL.req].trim()) || "",
          quarter: getQuarter(row[COL.sd] && row[COL.sd].trim())
        };
        const key = name.replace(/\s*-\s*Redwood City$/i,' Redwood City').replace(/\s*-\s*Corporate$/i,' - Corporate').trim();
        if (!accs[key]) {
          accs[key] = { name:key, rep:rep, zone:zone, allLocations:allLocs, totalSales:sales, months:months, hasSalesData:sales>0, promotions:promo.quarter?[promo]:[] };
        } else {
          if (sales > accs[key].totalSales) { accs[key].totalSales=sales; accs[key].hasSalesData=sales>0; }
          if (months > accs[key].months) accs[key].months=months;
          if (rep && !accs[key].rep) accs[key].rep=rep;
          if (zone && !accs[key].zone) accs[key].zone=zone;
          if (allLocs) accs[key].allLocations=true;
          if (promo.quarter) accs[key].promotions.push(promo);
        }
      });
      return Object.values(accs).filter(a => !["related account","brand"].includes(a.name.toLowerCase())).sort((a,b) => b.totalSales-a.totalSales);
    }

    function parseAccountActivity90Day(text) {
      const all = parseCSVRFC4180(text); if (!all.length) return [];
      const hi = all.findIndex(r => r.some(c => c.toLowerCase().includes("customer site sold to")));
      if (hi < 0) return [];
      const accs = {}, soMap = {};
      all.slice(hi+1).forEach(function(row) {
        if (row.length < 11) return;
        const sku=row[0]&&row[0].trim(), account=row[1]&&row[1].trim(), rep=(row[2]&&row[2].trim())||"";
        const date=(row[3]&&row[3].trim())||"", zone=(row[11]&&row[11].trim())||"";
        const soNum=(row[10]&&row[10].trim())||"", category=(row[4]&&row[4].trim())||"";
        if (!account||!sku||!sku.toLowerCase().startsWith("globs")) return;
        const extPrice=parseFloat((row[6]||"").replace(/[$,]/g,"").trim())||0;
        const qty=parseFloat((row[5]||"").trim())||0;
        const price=(qty>0&&extPrice>0)?+(extPrice/qty).toFixed(2):0;
        if (Math.abs(extPrice)<0.05&&qty<=1) return;
        const mk=account+"|||"+sku;
        if (!soMap[mk]) soMap[mk]=new Set(); if (soNum) soMap[mk].add(soNum);
        if (!accs[account]) {
          accs[account]={name:account,rep:rep,zone:zone,totalSales:0,months:3,hasSalesData:true,allLocations:false,promotions:[],soNumbers:new Set(),orderedSkus:[],totalQty:0,catRevenue90:{},soDates:{},_rows:[]};
        }
        const a=accs[account];
        if (rep&&!a.rep) a.rep=rep; if (zone&&!a.zone) a.zone=zone;
        if (soNum) a.soNumbers.add(soNum); if (soNum&&date&&!a.soDates[soNum]) a.soDates[soNum]=date;
        if (extPrice>0) { a.totalSales+=extPrice; a.totalQty+=qty; a._rows.push({date:date,qty:qty,extPrice:extPrice,category:category,sku:sku}); }
        const strain=sku.replace(/^Globs\s*-\s*/i,"").split(" - ")[0].trim();
        const ex=a.orderedSkus.find(s => s.sku===sku);
        if (ex) {
          if (extPrice>0) { ex.totalQty=(ex.totalQty||0)+qty; if(price>0&&date&&(!ex._lastPriceDate||date>=ex._lastPriceDate)){ex.wholesale=price;ex._lastPriceDate=date;} }
          if (date) { if(!ex.firstDate||date<ex.firstDate) ex.firstDate=date; if(!ex.lastDate||date>ex.lastDate) ex.lastDate=date; }
        } else {
          a.orderedSkus.push({sku:sku,strain:strain,category:category,wholesale:price,qty:qty,totalQty:extPrice>0?qty:0,firstDate:date||"",lastDate:date||""});
        }
      });
      const PERIODS=[7,30,60,90,180,270,365];
      let fMax=0;
      Object.values(accs).forEach(function(a) {
        (a._rows||[]).forEach(function(r) {
          if (!r.date) return;
          const p=r.date.split('/');
          const ts=new Date(parseInt(p[2]),parseInt(p[0])-1,parseInt(p[1])).getTime();
          if (!isNaN(ts)&&ts>fMax) fMax=ts;
        });
      });
      if (!fMax) fMax=Date.now();
      const cutoff={};
      PERIODS.forEach(function(d) { cutoff[d]=fMax-d*86400000; });
      Object.values(accs).forEach(function(a) {
        a.periodRevenue={7:0,30:0,60:0,90:0,180:0,270:0,365:0};
        a.periodCatRevenue={7:{},30:{},60:{},90:{},180:{},270:{},365:{}};
        a.skuPeriodUnits={};
        (a._rows||[]).forEach(function(r) {
          if (!r.date||!r.extPrice) return;
          const pts=r.date.split('/');
          const ts=new Date(parseInt(pts[2]),parseInt(pts[0])-1,parseInt(pts[1])).getTime();
          if (isNaN(ts)) return;
          PERIODS.forEach(function(d) {
            if (ts>=cutoff[d]) {
              a.periodRevenue[d]+=r.extPrice;
              const ck=r.category||"Other";
              a.periodCatRevenue[d][ck]=(a.periodCatRevenue[d][ck]||0)+r.extPrice;
              if (r.sku) {
                if (!a.skuPeriodUnits[r.sku]) a.skuPeriodUnits[r.sku]={7:0,30:0,60:0,90:0,180:0,270:0,365:0};
                a.skuPeriodUnits[r.sku][d]=(a.skuPeriodUnits[r.sku][d]||0)+(r.qty||0);
              }
            }
          });
        });
        a.revenue90=a.periodRevenue[90]; a.catRevenue90=a.periodCatRevenue[90];
        const ods={};
        (a._rows||[]).forEach(function(r) {
          if (!r.date||!r.extPrice||r.extPrice<=0) return;
          const p=r.date.split('/'); if(p.length!==3) return;
          const ts=new Date(parseInt(p[2]),parseInt(p[0])-1,parseInt(p[1])).getTime();
          if (!isNaN(ts)) ods[ts]=true;
        });
        a.orderDayTs=Object.keys(ods).map(Number).sort(function(a,b){return a-b;});
        delete a._rows;
      });
      const SUP=["upnorth samples","internal","test account"];
      return Object.values(accs)
        .filter(function(a) {
          if (!a.name||a.name.toLowerCase()==="customer site sold to") return false;

        })
        .map(function(a) {

                periodUnits: (a.skuPeriodUnits&&a.skuPeriodUnits[s.sku])||{}
              });
            })
          });
        })
        .sort(function(a,b){return b.totalSales-a.totalSales;});
    }

    function getTaxRate(name) { const n=(name||"").toLowerCase(); const cities=Object.keys(CA_TAX); for(let i=0;i<cities.length;i++){if(n.includes(cities[i]))return CA_TAX[cities[i]];} return 0.30; }
    function markupAnalysis(retail,ws,tax) { if(!ws||!retail||ws<1)return null; const raw=+(retail/ws).toFixed(2),consumer=+(retail*(1+tax)).toFixed(2),aligned=raw>=2&&raw<=2.5; return{raw,consumer,aligned,label:aligned?"aligned":raw<2?"below target":"above target"}; }
    function computeTier(orderDayTs) {
      const ts=(orderDayTs||[]).slice().sort(function(a,b){return a-b;}); const n=ts.length,now=Date.now();
      if(n<1)return{label:"New",color:"#888",bg:"#111",border:"#2a2a2a"};
      const span=n>1?(ts[n-1]-ts[0])/86400000:0,daysSince=(now-ts[n-1])/86400000;
      const gaps=[]; for(let i=1;i<n;i++)gaps.push((ts[i]-ts[i-1])/86400000);
      const avg=gaps.length?gaps.reduce(function(s,g){return s+g;},0)/gaps.length:999;
      if(n>=5&&avg<=35&&span>=120&&daysSince<=90)return{label:"Legacy",color:"#c9a84c",bg:"#1a1400",border:"#3d3000"};
      if(n>=2&&daysSince<=120)return{label:"On The Rise",color:"#4cade0",bg:"#001420",border:"#003050"};
      return{label:"New",color:"#888",bg:"#111",border:"#2a2a2a"};
    }
    function computeCadence(orderDayTs) {
      if(!orderDayTs||orderDayTs.length<2)return{cadenceDays:null,lastOrderDate:""};
      const ts=[].concat(orderDayTs).sort(function(a,b){return a-b;}),gaps=[];
      for(let i=1;i<ts.length;i++)gaps.push((ts[i]-ts[i-1])/86400000);
      const cd=Math.round(gaps.reduce(function(s,g){return s+g;},0)/gaps.length);
      const ld=new Date(ts[ts.length-1]);
      const mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      return{cadenceDays:cd,lastOrderDate:mo[ld.getMonth()]+' '+ld.getDate()};
    }
    function cur(n){return n>0?'$'+Number(n).toFixed(2):'—';}
    function curK(n){if(!n||n<=0)return'—';return n>=1000?'$'+(n/1000).toFixed(1)+'k':'$'+n.toFixed(0);}
    function fmtDate(iso){if(!iso)return'—';return new Date(iso).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"2-digit"});}
    function getWeekKey(){const d=new Date();d.setDate(d.getDate()-d.getDay());return d.toISOString().split("T")[0];}
    function fuzzyMatch(a,b){const norm=function(s){return s.toLowerCase().replace(/\s*-\s*corporate/gi,"").replace(/\s*\(.*?\)/g,"").replace(/[^a-z0-9\s]/g,"").replace(/\s+/g," ").trim();};const na=norm(a),nb=norm(b);if(na===nb)return true;const wa=na.split(" ").filter(function(w){return w.length>3;}),wb=nb.split(" ").filter(function(w){return w.length>3;});return wa.filter(function(w){return wb.includes(w);}).length>=Math.min(2,wa.length,wb.length);}

      function lookupStrain(name) {
        if (!name) return null;

        if (!norm) return null;
        // Direct lookup from pre-computed strain DB (has name, type, cross, genetics letter)
        var db = window._STRAIN_DB || [];
        var match = db.find(function(s) { return s.n.toLowerCase().replace(/[^a-z0-9]/g,'') === norm; });
        if (match) return {n: match.n, t: match.t || (match.g==='I'?'Indica':match.g==='S'?'Sativa':'Hybrid'), c: match.c || '', g: match.g};
        return null;

      function setField(k,v) {

          if (k === 'strain' && v) {
            var match = lookupStrain(v);

      // COA PDF parsing — Encore Labs format
      async function parseCOA(file) {
        setParseStatus('Extracting text from PDF...');
        try {
          if (typeof pdfjsLib === 'undefined') { setParseStatus('Error: pdf.js not loaded — check internet connection.'); return; }
          pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
          var buf = await file.arrayBuffer();
          var pdf = await pdfjsLib.getDocument({data: buf}).promise;
          var allText = '';
          for (var i = 1; i <= pdf.numPages; i++) {
            var page = await pdf.getPage(i);
            var tc = await page.getTextContent();
            allText += tc.items.map(function(it) { return it.str; }).join(' ') + '\n';
          }

          var data = {};

          // ── TITLE LINE: "GLOBS - Grandma's Cookies - Vape Cart - 1 Gram"
          var titleMatch = allText.match(/GLOBS\s*[-–]\s*(.+?)\s*[-–]\s*(Vape\s*Cart|Badder|Sauce|Diamonds?|Shatter)/i);
          if (titleMatch) {
            data.strain = titleMatch[1].trim().replace(/['']/g, '').replace(/\s+/g, ' ');
            var pt = titleMatch[2].toLowerCase();
            if (pt.includes('vape') || pt.includes('cart')) data.inferredProduct = 'VAPE CART';
            else if (pt.includes('badder')) data.inferredProduct = 'BADDER';
            else if (pt.includes('sauce')) data.inferredProduct = 'SAUCE';
            else if (pt.includes('diamond')) data.inferredProduct = 'DIAMONDS';
            else if (pt.includes('shatter')) data.inferredProduct = 'SHATTER';
          }

          // ── STRAIN: fallback from "Strain: Gransma's Cookies" field
          if (!data.strain) {
            var strF = allText.match(/Strain:\s*(.+?)(?:\s{2,}|\n|Received|Matrix)/i);
            if (strF) data.strain = strF[1].trim().replace(/['']/g, '').replace(/\s+/g, ' ');
          }

          // ── METRC BATCH: "METRC Batch: 1A406030000A2DB000006064"
          var metrcBatch = allText.match(/METRC\s*Batch:\s*(1A[A-Z0-9]{20,26})/i);
          if (metrcBatch) data.metrc = metrcBatch[1];

          // ── BATCH#: "Batch#: GLO-VC-020"
          var batchNum = allText.match(/Batch#?:\s*(GLO[A-Z0-9\-]+)/i);
          if (batchNum) data.batch = batchNum[1];

          // ── CANNABINOIDS: "74.998 % Total THC" ... "0.146 % Total CBD" ... "78.916 % Total Cannabinoids"
          // These appear as big numbers followed by "Total THC" etc.
          var thcM = allText.match(/([\d.]+)\s*%\s*Total\s*THC/i);
          if (thcM) data.thc = parseFloat(thcM[1]).toFixed(3);

          var cbdM = allText.match(/([\d.]+)\s*%\s*Total\s*CBD/i);
          if (cbdM) data.cbd = parseFloat(cbdM[1]).toFixed(3);

          var cannaM = allText.match(/([\d.]+)\s*%\s*Total\s*Cannabinoids/i);
          if (cannaM) data.sumCanna = parseFloat(cannaM[1]).toFixed(3);

          // ── TERPENES TOTAL: "Total 6.108 61.08" in terpenes section
          var terpTotal = allText.match(/Total\s+([\d.]+)\s+[\d.]+\s*(?:Date|LOQ)/i);
          if (terpTotal) data.terpenes = parseFloat(terpTotal[1]).toFixed(3);
          // Alt: look for terpene total percentage
          if (!data.terpenes) {
            var terpAlt = allText.match(/Terpenes.*?Total\s+([\d.]+)/is);
            if (terpAlt) data.terpenes = parseFloat(terpAlt[1]).toFixed(3);
          }

          // ── PRODUCED DATE: "Produced: 03/31/2026"
          var prodDate = allText.match(/Produced:\s*([\d\/]+)/i);
          if (prodDate) data.mfgDate = prodDate[1];

          // ── TYPE: "Type: Vape"
          if (!data.inferredProduct) {
            var typeM = allText.match(/Type:\s*(Vape|Badder|Sauce|Diamond|Shatter|Concentrate)/i);
            if (typeM) {
              var tt = typeM[1].toLowerCase();
              data.inferredProduct = tt.includes('vape') ? 'VAPE CART' : tt.toUpperCase();
            }
          }

          // ── STRAIN DB LOOKUP — get genetics cross + I/H/S type
          if (data.strain) {
            // Try exact match first
            var match = lookupStrain(data.strain);
            // Fuzzy: if no match, try cleaning common lab typos
            if (!match) {
              var cleaned = data.strain.replace(/Gransma/gi, 'Grandma').replace(/[''`]/g, '');
              match = lookupStrain(cleaned);
              if (match) data.strain = cleaned; // use corrected name
            }
            if (match) {
              data.cross = match.c || '';
              data.type = match.t || 'Hybrid';
            }
          }

          setCoaData(data);
          setFields(function(prev) {
            return {
              strain: data.strain || prev.strain,
              cross: data.cross || prev.cross,
              type: data.type || prev.type,
              thc: data.thc || prev.thc,
              cbd: data.cbd || prev.cbd,
              sumCanna: data.sumCanna || prev.sumCanna,
              terpenes: data.terpenes || prev.terpenes,
              batch: data.batch || prev.batch,
              metrc: data.metrc || prev.metrc,
              pkgDate: prev.pkgDate || todayISO,
              testDate: data.testDate || prev.testDate,
              mfgDate: data.mfgDate || prev.mfgDate,
              netWt: prev.netWt || '1.0'
            };
          });
          if (data.inferredProduct) setProductType(data.inferredProduct);

          // Build status message showing what was found
          var found = [];
          if (data.strain) found.push('strain');
          if (data.thc) found.push('THC');
          if (data.cbd) found.push('CBD');
          if (data.terpenes) found.push('terpenes');
          if (data.sumCanna) found.push('cannabinoids');
          if (data.batch) found.push('batch');
          if (data.metrc) found.push('METRC');
          if (data.cross) found.push('genetics from DB');
          if (data.type) found.push(data.type);
          setParseStatus('COA parsed: ' + found.join(' · '));
        } catch(err) {
          setParseStatus('Parse error: ' + err.message);
        }
      }

        else if (len <= 13) { fs=22; ls=1.5; }
        else if (len <= 15) { fs=20; ls=1; }
        else if (len <= 17) { fs=18; ls=0.8; }
        else if (len <= 19) { fs=14; ls=0.3; }

        // Bottom arc: vapes show strain type (HYBRID), concentrates show product type (BADDER)

        var botFs = botText.length > 8 ? 18 : 22;
        var botLs = botText.length > 8 ? 2 : 4;

        return React.createElement('svg', {viewBox: '0 0 300 300', style: {width: 260, height: 260, background: isClear ? 'repeating-conic-gradient(#eee 0% 25%, #fff 0% 50%) 50%/12px 12px' : '#fff', borderRadius: '50%', border: '2px solid #222', display: 'block'}},
          React.createElement('defs', null,
            React.createElement('path', {id:'topArc', d:'M 50,115 A 140,140 0 0,1 250,115', fill:'none'}),
            React.createElement('path', {id:'botArc', d:'M 75,200 A 100,100 0 0,0 225,200', fill:'none'})
          ),
          React.createElement('circle', {cx:150,cy:150,r:140,fill:'none',stroke:'#000',strokeWidth:2}),
          React.createElement('text', {fill:'#000',fontFamily:'Arial Black,Arial,Helvetica,sans-serif',fontWeight:900,fontSize:fs, letterSpacing:ls},
            React.createElement('textPath', {href:'#topArc',textAnchor:'middle',startOffset:'50%'}, sn)
          ),
          React.createElement('text', {x:150,y:155,textAnchor:'middle',fontSize:24,fontWeight:900,fill:'#000',fontFamily:'Arial Black,Arial,Helvetica,sans-serif'}, 'THC: '+thcDisp+'%'),
          React.createElement('text', {x:150,y:182,textAnchor:'middle',fontSize:20,fontWeight:900,fill:'#000',fontFamily:'Arial Black,Arial,Helvetica,sans-serif'}, 'TERPENES: '+terpDisp+'%'),
          React.createElement('text', {fill:'#000',fontFamily:'Arial Black,Arial,Helvetica,sans-serif',fontWeight:900,fontSize:botFs,letterSpacing:botLs},
            React.createElement('textPath', {href:'#botArc',textAnchor:'middle',startOffset:'50%'}, botText)
          )
        );
      }

      return (
        <div>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20,flexWrap:'wrap',gap:12}}>
            <div><div style={{fontSize:14,fontWeight:800,letterSpacing:3}}>LABEL GENERATOR</div><div style={{fontSize:9,color:C.dim,marginTop:3}}>Upload COA → auto-fill strain · THC · CBD · terpenes · batch · METRC → DB fills genetics + type → PKG date = today</div></div>
            <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
              <input ref={coaRef} type="file" accept=".pdf" onChange={handleCOAUpload} style={{display:'none'}}/>
              <button onClick={function(){coaRef.current&&coaRef.current.click();}} style={{padding:'7px 16px',borderRadius:3,fontSize:11,fontWeight:700,cursor:'pointer',fontFamily:'inherit',border:'1px solid '+C.text,background:C.text,color:C.bg}}>Upload COA PDF</button>
              <button onClick={fillTestData} style={{padding:'7px 16px',borderRadius:3,fontSize:11,cursor:'pointer',fontFamily:'inherit',border:'1px solid '+C.border,background:'transparent',color:C.dim}}>Test: Grandmas Cookies</button>
            </div>
          </div>
          {parseStatus&&<div style={{marginBottom:14,padding:'8px 14px',borderRadius:4,fontSize:11,background:parseStatus.includes('rror')?C.dangerBg:parseStatus.includes('parsed')||parseStatus.includes('loaded')?C.goodBg:C.surface,border:'1px solid '+(parseStatus.includes('rror')?C.dangerBdr:parseStatus.includes('parsed')||parseStatus.includes('loaded')?C.goodBdr:C.border),color:parseStatus.includes('rror')?C.danger:parseStatus.includes('parsed')||parseStatus.includes('loaded')?C.good:C.muted}}>{parseStatus}</div>}

          <div className='gpi-twocol' style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20,marginBottom:24}}>
            {/* LEFT: Data fields */}
            <div style={{background:C.surface,border:'1px solid '+C.border,borderRadius:6,padding:20}}>
              <div style={{fontSize:9,color:C.dim,letterSpacing:1.5,textTransform:'uppercase',marginBottom:6}}>Label Data</div>
              <div style={{fontSize:8,color:C.dim,marginBottom:14,lineHeight:1.8}}>{'One COA generates all stickers. Select vapes or concentrates above.'}</div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
                {/* ── FROM COA ── */}
                <div style={{gridColumn:'1/-1',fontSize:8,color:C.warn,letterSpacing:1.5,textTransform:'uppercase',marginTop:4,marginBottom:-4,fontWeight:700}}>FROM COA</div>
                <div style={{gridColumn:'1/-1'}}><div style={{fontSize:9,color:C.dim,marginBottom:3}}>STRAIN NAME</div><input value={fields.strain} onChange={function(e){setField('strain',e.target.value);}} placeholder="Extracted from COA" style={inpSt}/>{fields.strain&&lookupStrain(fields.strain)&&(function(){var r=lookupStrain(fields.strain);return<div style={{fontSize:9,color:C.good,marginTop:4,padding:'4px 8px',background:C.goodBg,border:'1px solid '+C.goodBdr,borderRadius:3}}>DB: <strong>{r.n}</strong> · {r.t} {r.c&&<span>· {r.c}</span>}</div>;})()}{fields.strain&&!lookupStrain(fields.strain)&&<div style={{fontSize:9,color:C.warn,marginTop:4,padding:'4px 8px',background:C.warnBg,border:'1px solid '+C.warnBdr,borderRadius:3}}>Not in strain DB — enter genetics + type manually</div>}</div>
                <div><div style={{fontSize:9,color:C.dim,marginBottom:3}}>THC %</div><input value={fields.thc} onChange={function(e){setField('thc',e.target.value);}} placeholder="76.03" style={inpSt}/>{fields.thc&&<div style={{fontSize:8,color:C.muted,marginTop:2}}>[{(parseFloat(fields.thc)*10).toFixed(0)}] MG/PKG</div>}</div>
                <div><div style={{fontSize:9,color:C.dim,marginBottom:3}}>TERPENES %</div><input value={fields.terpenes} onChange={function(e){setField('terpenes',e.target.value);}} placeholder="8.29" style={inpSt}/></div>
                <div><div style={{fontSize:9,color:C.dim,marginBottom:3}}>CBD %</div><input value={fields.cbd} onChange={function(e){setField('cbd',e.target.value);}} placeholder="0.14" style={inpSt}/>{fields.cbd&&<div style={{fontSize:8,color:C.muted,marginTop:2}}>{(parseFloat(fields.cbd)*10).toFixed(1)} MG/PKG</div>}</div>
                <div><div style={{fontSize:9,color:C.dim,marginBottom:3}}>SUM CANNABINOIDS %</div><input value={fields.sumCanna} onChange={function(e){setField('sumCanna',e.target.value);}} placeholder="78.9" style={inpSt}/>{fields.sumCanna&&<div style={{fontSize:8,color:C.muted,marginTop:2}}>[{(parseFloat(fields.sumCanna)*10).toFixed(0)}] MG/PKG</div>}</div>
                <div><div style={{fontSize:9,color:C.dim,marginBottom:3}}>BATCH CODE</div><input value={fields.batch} onChange={function(e){setField('batch',e.target.value);}} placeholder="GLO-VC-006" style={inpSt}/></div>
                <div style={{gridColumn:'1/-1'}}><div style={{fontSize:9,color:C.dim,marginBottom:3}}>METRC BATCH #</div><input value={fields.metrc} onChange={function(e){setField('metrc',e.target.value);}} placeholder="1A406030000A2DB000005858" style={inpSt}/></div>

                {/* ── FROM WEEDMAPS DB ── */}
                <div style={{gridColumn:'1/-1',fontSize:8,color:'#4a9eff',letterSpacing:1.5,textTransform:'uppercase',marginTop:8,marginBottom:-4,fontWeight:700}}>FROM STRAIN DB</div>
                <div style={{gridColumn:'1/-1'}}><div style={{fontSize:9,color:C.dim,marginBottom:3}}>GENETICS CROSS</div><input value={fields.cross} onChange={function(e){setField('cross',e.target.value);}} placeholder="Auto-filled from Weedmaps DB" style={Object.assign({},inpSt,{borderColor:fields.cross?C.goodBdr:C.border})}/></div>
                <div><div style={{fontSize:9,color:C.dim,marginBottom:3}}>I / H / S TYPE</div><select value={fields.type} onChange={function(e){setField('type',e.target.value);}} style={Object.assign({},inpSt,{cursor:'pointer'})}><option value="Hybrid">Hybrid</option><option value="Indica">Indica</option><option value="Sativa">Sativa</option></select></div>
                <div><div style={{fontSize:9,color:C.dim,marginBottom:3}}>PRODUCT <span style={{fontSize:7,color:C.dim}}>(concentrates only)</span></div><select value={productType} onChange={function(e){setProductType(e.target.value);}} style={Object.assign({},inpSt,{cursor:'pointer'})}>{PRODUCTS.map(function(p){return<option key={p} value={p}>{p}</option>;})}</select></div>

                {/* ── AUTO ── */}
                <>
                <div style={{gridColumn:'1/-1',fontSize:8,color:C.good,letterSpacing:1.5,textTransform:'uppercase',marginTop:8,marginBottom:-4,fontWeight:700}}>AUTO-GENERATED</div>
                <div><div style={{fontSize:9,color:C.dim,marginBottom:3}}>P.K.G DATE <span style={{fontSize:7,color:C.good}}>= today</span></div><input type="date" value={fields.pkgDate} onChange={function(e){setField('pkgDate',e.target.value);}} style={inpSt}/></div>
                </>
              </div>
              <div style={{display:'flex',gap:8,marginTop:16,justifyContent:'flex-end'}}>
                <button onClick={function(){setFields({strain:'',cross:'',type:'Hybrid',thc:'',cbd:'',sumCanna:'',batch:'',pkgDate:todayISO,mfgDate:'',testDate:'',metrc:'',terpenes:'',netWt:'1.0'});setCoaData(null);setParseStatus('');setProductType('VAPE CART');}} style={{padding:'6px 14px',borderRadius:3,fontSize:11,cursor:'pointer',border:'1px solid '+C.border,background:'transparent',color:C.dim}}>Clear</button>
                <button onClick={approveBatch} disabled={!fields.strain||!fields.batch} style={{padding:'6px 14px',borderRadius:3,fontSize:11,fontWeight:700,cursor:'pointer',border:'none',background:C.good,color:'#fff',opacity:(!fields.strain||!fields.batch)?0.4:1}}>Approve Batch</button>
              </div>
            </div>

            {/* RIGHT: All sticker previews */}
            <div>
              <div style={{display:'flex',gap:6,marginBottom:12}}>
                {[['vapes','VAPES','Cart back + front circle + case'],['concentrates','CONCENTRATES','Jar label + jar bottom circle + case']].map(function(m){return<button key={m[0]} onClick={function(){setLabelMode(m[0]);if(m[0]==='vapes')setProductType('VAPE CART');}} style={{flex:1,padding:'8px 12px',borderRadius:4,fontSize:10,fontWeight:labelMode===m[0]?800:400,cursor:'pointer',fontFamily:'inherit',border:'1px solid '+(labelMode===m[0]?C.text:C.border),background:labelMode===m[0]?C.text:'transparent',color:labelMode===m[0]?C.bg:C.dim,textAlign:'left'}}><div style={{letterSpacing:1}}>{m[1]}</div><div style={{fontSize:7,marginTop:2,fontWeight:400,opacity:0.7}}>{m[2]}</div></button>;})}
              </div>

              <div style={{fontSize:9,color:C.dim,letterSpacing:1,marginBottom:10}}>BACK LABEL — {labelMode==='vapes'?'OL285WX':'OL285WX'}</div>
              <div style={{display:'flex',justifyContent:'center',padding:16,background:C.raised,borderRadius:6,border:'1px solid '+C.border,marginBottom:14}}>
                {React.createElement(RectLabel,{isCase:false})}
              </div>

              <div style={{display:'flex',gap:14}}>
                <div style={{flex:1}}>
                  <div style={{fontSize:9,color:C.dim,letterSpacing:1,marginBottom:6}}>{labelMode==='vapes'?'FRONT CIRCLE — OL5275':'JAR BOTTOM — OL5275CL'}</div>
                  <div style={{display:'flex',justifyContent:'center',padding:14,background:C.raised,borderRadius:6,border:'1px solid '+C.border}}>
                    {React.createElement(CircleLabel,{isClear:labelMode==='concentrates'})}
                  </div>
                </div>
                <div style={{flex:1}}>
                  <div style={{fontSize:9,color:C.dim,letterSpacing:1,marginBottom:6}}>CASE STICKER — OL5030WX</div>
                  <div style={{display:'flex',justifyContent:'center',padding:14,background:C.raised,borderRadius:6,border:'1px solid '+C.border,overflow:'auto'}}>
                    {React.createElement(RectLabel,{isCase:true})}
                  </div>
                </div>
              </div>
            </div>
          </div>

          {/* Batch Queue */}
          {batchQueue.length>0&&(
            <div style={{background:C.surface,border:'1px solid '+C.border,borderRadius:6,padding:20,marginBottom:20}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
                <div style={{fontSize:9,color:C.dim,letterSpacing:1.5,textTransform:'uppercase'}}>Approved Batches ({batchQueue.length})</div>
                <button onClick={draftEmail} style={{padding:'6px 14px',borderRadius:3,fontSize:11,fontWeight:700,cursor:'pointer',fontFamily:'inherit',border:'1px solid #2196f3',background:'#2196f3',color:'#fff'}}>Draft Compliance Email</button>
              </div>
              <div style={{overflowX:'auto'}}><table style={{width:'100%',borderCollapse:'collapse'}}>
                <thead><tr style={{background:C.raised}}>{['Strain','Type','Product','THC','Batch','METRC','Approved',''].map(function(h,i){return<th key={h+i} style={{padding:'6px 10px',fontSize:8,fontWeight:700,letterSpacing:1,color:C.dim,textAlign:'left',borderBottom:'1px solid '+C.border}}>{h}</th>;})}</tr></thead>
                <tbody>{batchQueue.map(function(b,i){return<tr key={b.id} style={{background:i%2?'#0a0a0a':'transparent'}}><td style={{padding:'8px 10px',fontSize:12,fontWeight:600}}>{b.strain}</td><td style={{padding:'8px 10px',fontSize:10,color:C.muted}}>{b.type}</td><td style={{padding:'8px 10px',fontSize:10,color:C.dim}}>{b.productType}</td><td style={{padding:'8px 10px',fontSize:11,fontWeight:700}}>{b.thc}%</td><td style={{padding:'8px 10px',fontSize:10,fontFamily:'monospace'}}>{b.batch}</td><td style={{padding:'8px 10px',fontSize:8,fontFamily:'monospace',color:C.dim}}>{b.metrc||'—'}</td><td style={{padding:'8px 10px',fontSize:9,color:C.dim}}>{new Date(b.approved).toLocaleDateString()}</td><td style={{padding:'8px 10px'}}><button onClick={function(){setBatchQueue(function(q){return q.filter(function(x){return x.id!==b.id;});});}} style={{padding:'2px 6px',borderRadius:2,fontSize:8,cursor:'pointer',border:'1px solid '+C.border,background:'transparent',color:C.dim}}>✕</button></td></tr>;})}</tbody>
              </table></div>
            </div>
          )}
        </div>
      );
    }

    // ── YIELD TAB ──────────────────────────────────────────────────────────────
    function YieldTab({C}) {
      if (!C) C = DARK_C;
      var inpSt2 = {background:C.bg,border:'1px solid '+C.border,borderRadius:3,color:C.text,fontSize:12,fontFamily:'inherit',padding:'6px 10px',outline:'none',width:'100%'};

      function yLookupStrain(name) {
        if (!name) return null;
        var norm = name.toLowerCase().replace(/[^a-z0-9]/g,'');
        if (!norm) return null;
        var db = window._STRAIN_DB || [];
        var match = db.find(function(s) { return s.n.toLowerCase().replace(/[^a-z0-9]/g,'') === norm; });
        if (match) return {n: match.n, t: match.t || (match.g==='I'?'Indica':match.g==='S'?'Sativa':'Hybrid'), c: match.c || '', g: match.g};
        return null;
      }
const YIELD_KEY = 'gpi-yield-log';
      const [yieldLog, setYieldLog] = useState([]);
      const [yLoading, setYLoading] = useState(true);
      const [yForm, setYForm] = useState({strain:'',weightLbs:'',biomassPrice:'25',tollFee:'40',yieldPct:'',notes:''});

      useEffect(function(){
        async function load(){try{var r=await window.storage.get(YIELD_KEY);if(r)setYieldLog(JSON.parse(r.value));}catch(e){}setYLoading(false);}
        load();
      },[]);

      async function saveLog(next){setYieldLog(next);try{await window.storage.set(YIELD_KEY,JSON.stringify(next));}catch(e){}}

      // Strain lookup for auto-fill
      var yStrain = yForm.strain ? yLookupStrain(yForm.strain) : null;

      // Calculations
      var wt = parseFloat(yForm.weightLbs) || 0;
      var bp = parseFloat(yForm.biomassPrice) || 0;
      var toll = parseFloat(yForm.tollFee) || 0;
      var yld = parseFloat(yForm.yieldPct) || 0;
      var inputGrams = wt * 453.6;
      var biomassCost = wt * bp;
      var tollCost = wt * toll;
      var totalCost = biomassCost + tollCost;
      var outputGrams = inputGrams * (yld / 100);
      var costPerGram = outputGrams > 0 ? totalCost / outputGrams : 0;

      function addEntry(){
        if(!yForm.strain || wt<=0 || yld<=0) return;
        var entry = {
          id: Date.now(),
          date: new Date().toISOString(),
          strain: yForm.strain,
          type: yStrain ? yStrain.t : 'Hybrid',
          weightLbs: wt,
          biomassPrice: bp,
          tollFee: toll,
          yieldPct: yld,
          inputGrams: Math.round(inputGrams*10)/10,
          outputGrams: Math.round(outputGrams*10)/10,
          totalCost: Math.round(totalCost*100)/100,
          costPerGram: Math.round(costPerGram*100)/100,
          notes: yForm.notes
        };
        saveLog([entry].concat(yieldLog));
        setYForm({strain:'',weightLbs:'',biomassPrice:yForm.biomassPrice,tollFee:yForm.tollFee,yieldPct:'',notes:''});
      }

      function removeEntry(id){saveLog(yieldLog.filter(function(e){return e.id!==id;}));}

      // Summary stats
      var avgYield = yieldLog.length > 0 ? yieldLog.reduce(function(s,e){return s+e.yieldPct;},0)/yieldLog.length : 0;
      var avgCpg = yieldLog.length > 0 ? yieldLog.reduce(function(s,e){return s+e.costPerGram;},0)/yieldLog.length : 0;
      var totalOutput = yieldLog.reduce(function(s,e){return s+e.outputGrams;},0);
      var totalSpent = yieldLog.reduce(function(s,e){return s+e.totalCost;},0);

      if(yLoading) return <div style={{padding:40,color:C.dim,fontSize:12}}>Loading…</div>;

      return(
        <div>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20,flexWrap:'wrap',gap:12}}>
            <div><div style={{fontSize:14,fontWeight:800,letterSpacing:3}}>YIELD + COST TRACKING</div><div style={{fontSize:9,color:C.dim,marginTop:3}}>Input biomass → Greenline processing → output extract · cost per gram</div></div>
          </div>

          {/* Summary cards */}
          {yieldLog.length>0&&(
            <div style={{display:'flex',gap:10,marginBottom:20,flexWrap:'wrap'}}>
              {[
                {l:'Avg Yield',v:avgYield.toFixed(1)+'%',c:avgYield>=15?C.good:avgYield>=10?C.warn:C.danger},
                {l:'Avg Cost/Gram',v:'$'+avgCpg.toFixed(2),c:avgCpg<1.5?C.good:avgCpg<2.5?C.warn:C.danger},
                {l:'Total Output',v:(totalOutput/1000).toFixed(1)+'kg',c:C.text},
                {l:'Total Spent',v:'$'+totalSpent.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0}),c:C.muted},
                {l:'Batches',v:yieldLog.length,c:C.text}
              ].map(function(s){return<div key={s.l} style={{background:C.surface,border:'1px solid '+C.border,borderRadius:4,padding:'12px 16px',flex:1,minWidth:100}}><div style={{fontSize:8,color:C.dim,letterSpacing:1.5,textTransform:'uppercase',marginBottom:4}}>{s.l}</div><div style={{fontSize:18,fontWeight:800,color:s.c}}>{s.v}</div></div>;})}
            </div>
          )}

          <div className='gpi-twocol' style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20,marginBottom:24}}>
            {/* LEFT: Input form */}
            <div style={{background:C.surface,border:'1px solid '+C.border,borderRadius:6,padding:20}}>
              <div style={{fontSize:9,color:C.dim,letterSpacing:1.5,textTransform:'uppercase',marginBottom:14}}>New Yield Entry</div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
                <div style={{gridColumn:'1/-1'}}><div style={{fontSize:9,color:C.dim,marginBottom:3}}>STRAIN {yStrain&&<span style={{color:C.good,marginLeft:6}}>✓ {yStrain.t}</span>}</div><input value={yForm.strain} onChange={function(e){setYForm(function(p){return Object.assign({},p,{strain:e.target.value});});}} placeholder="e.g. Honey Butter" style={inpSt2}/></div>
                <div><div style={{fontSize:9,color:C.dim,marginBottom:3}}>INPUT WEIGHT (lbs)</div><input type="number" step="0.1" value={yForm.weightLbs} onChange={function(e){setYForm(function(p){return Object.assign({},p,{weightLbs:e.target.value});});}} placeholder="10" style={inpSt2}/>{wt>0&&<div style={{fontSize:8,color:C.muted,marginTop:2}}>= {inputGrams.toFixed(0)}g input</div>}</div>
                <div><div style={{fontSize:9,color:C.dim,marginBottom:3}}>BIOMASS PRICE ($/lb)</div><input type="number" step="1" value={yForm.biomassPrice} onChange={function(e){setYForm(function(p){return Object.assign({},p,{biomassPrice:e.target.value});});}} placeholder="25" style={inpSt2}/>{wt>0&&bp>0&&<div style={{fontSize:8,color:C.muted,marginTop:2}}>= ${biomassCost.toFixed(0)} biomass</div>}</div>
                <div><div style={{fontSize:9,color:C.dim,marginBottom:3}}>TOLL PROCESSING ($/lb)</div><input type="number" step="1" value={yForm.tollFee} onChange={function(e){setYForm(function(p){return Object.assign({},p,{tollFee:e.target.value});});}} placeholder="40" style={inpSt2}/>{wt>0&&toll>0&&<div style={{fontSize:8,color:C.muted,marginTop:2}}>= ${tollCost.toFixed(0)} processing</div>}</div>
                <div><div style={{fontSize:9,color:C.dim,marginBottom:3}}>YIELD (%)</div><input type="number" step="0.1" value={yForm.yieldPct} onChange={function(e){setYForm(function(p){return Object.assign({},p,{yieldPct:e.target.value});});}} placeholder="15" style={inpSt2}/>{yld>0&&wt>0&&<div style={{fontSize:8,color:C.muted,marginTop:2}}>= {outputGrams.toFixed(0)}g output</div>}</div>
                <div style={{gridColumn:'1/-1'}}><div style={{fontSize:9,color:C.dim,marginBottom:3}}>NOTES <span style={{fontSize:7}}>(optional)</span></div><input value={yForm.notes} onChange={function(e){setYForm(function(p){return Object.assign({},p,{notes:e.target.value});});}} placeholder="Batch #, source, etc." style={inpSt2}/></div>
              </div>
              <div style={{display:'flex',gap:8,marginTop:16,justifyContent:'flex-end'}}>
                <button onClick={function(){setYForm({strain:'',weightLbs:'',biomassPrice:yForm.biomassPrice,tollFee:yForm.tollFee,yieldPct:'',notes:''});}} style={{padding:'6px 14px',borderRadius:3,fontSize:11,cursor:'pointer',border:'1px solid '+C.border,background:'transparent',color:C.dim}}>Clear</button>
                <button onClick={addEntry} disabled={!yForm.strain||wt<=0||yld<=0} style={{padding:'6px 14px',borderRadius:3,fontSize:11,fontWeight:700,cursor:'pointer',border:'none',background:C.good,color:'#fff',opacity:(!yForm.strain||wt<=0||yld<=0)?0.4:1}}>Log Entry</button>
              </div>
            </div>

            {/* RIGHT: Live calculation */}
            <div style={{background:C.surface,border:'1px solid '+C.border,borderRadius:6,padding:20}}>
              <div style={{fontSize:9,color:C.dim,letterSpacing:1.5,textTransform:'uppercase',marginBottom:14}}>Cost Breakdown</div>
              <div style={{display:'flex',flexDirection:'column',gap:12}}>
                <div style={{display:'flex',justifyContent:'space-between',padding:'8px 0',borderBottom:'1px solid '+C.border}}><span style={{fontSize:11,color:C.dim}}>Biomass ({wt||'--'} lbs × ${bp||'--'}/lb)</span><span style={{fontSize:13,fontWeight:700}}>${biomassCost.toFixed(2)}</span></div>
                <div style={{display:'flex',justifyContent:'space-between',padding:'8px 0',borderBottom:'1px solid '+C.border}}><span style={{fontSize:11,color:C.dim}}>Toll Processing ({wt||'--'} lbs × ${toll||'--'}/lb)</span><span style={{fontSize:13,fontWeight:700}}>${tollCost.toFixed(2)}</span></div>
                <div style={{display:'flex',justifyContent:'space-between',padding:'8px 0',borderBottom:'1px solid '+C.border}}><span style={{fontSize:12,fontWeight:700}}>Total Input Cost</span><span style={{fontSize:14,fontWeight:800}}>${totalCost.toFixed(2)}</span></div>
                <div style={{display:'flex',justifyContent:'space-between',padding:'8px 0',borderBottom:'1px solid '+C.border}}><span style={{fontSize:11,color:C.dim}}>Input → Output</span><span style={{fontSize:12,fontWeight:600}}>{inputGrams.toFixed(0)}g → {outputGrams.toFixed(0)}g <span style={{color:yld>=15?C.good:yld>=10?C.warn:C.danger}}>({yld||'--'}%)</span></span></div>
                <div style={{display:'flex',justifyContent:'space-between',padding:'12px 0',background:C.raised,borderRadius:4,padding:'12px 14px',marginTop:4}}>
                  <span style={{fontSize:13,fontWeight:800}}>COST PER GRAM</span>
                  <span style={{fontSize:22,fontWeight:900,color:costPerGram>0?(costPerGram<1.5?C.good:costPerGram<2.5?C.warn:C.danger):C.dim}}>{costPerGram>0?'$'+costPerGram.toFixed(2):'--'}</span>
                </div>
                {costPerGram>0&&(
                  <div style={{fontSize:9,color:C.dim,lineHeight:1.8}}>
                    At this cost/gram, a 1g cart (+ $2.17 pkg + $1.00 labor + $0.40 test) = <strong style={{color:C.text}}>${(costPerGram+2.17+1.00+0.40).toFixed(2)}</strong> vs $12 wholesale = <strong style={{color:C.good}}>${(12-costPerGram-2.17-1.00-0.40).toFixed(2)} margin</strong>
                  </div>
                )}
              </div>
            </div>
          </div>

          {/* Strain Performance Ranking */}
          {yieldLog.length>0&&(function(){
            // Aggregate by strain, sorted by avg yield desc
            var byStrain = {};
            yieldLog.forEach(function(e){
              if(!byStrain[e.strain]) byStrain[e.strain] = {strain:e.strain,type:e.type,entries:0,totalYield:0,totalInput:0,totalOutput:0,totalCost:0,bestYield:0,bestCpg:Infinity};
              var s = byStrain[e.strain];
              s.entries++;
              s.totalYield += e.yieldPct;
              s.totalInput += e.weightLbs;
              s.totalOutput += e.outputGrams;
              s.totalCost += e.totalCost;
              if(e.yieldPct > s.bestYield) s.bestYield = e.yieldPct;
              if(e.costPerGram < s.bestCpg) s.bestCpg = e.costPerGram;
            });
            var ranked = Object.values(byStrain).map(function(s){
              s.avgYield = s.totalYield / s.entries;
              s.avgCpg = s.totalOutput > 0 ? s.totalCost / s.totalOutput : 0;
              return s;
            }).sort(function(a,b){ return b.avgYield - a.avgYield; });

            return(
              <div style={{background:C.surface,border:'1px solid '+C.border,borderRadius:6,overflow:'hidden',marginBottom:16}}>
                <div style={{padding:'12px 16px',borderBottom:'1px solid '+C.border}}>
                  <div style={{fontSize:9,color:C.dim,letterSpacing:1.5,textTransform:'uppercase'}}>Strain Performance — sorted by yield</div>
                  <div style={{fontSize:8,color:C.dim,marginTop:2}}>Use as a guide for biomass purchasing — higher yield = lower cost per gram</div>
                </div>
                <div style={{overflowX:'auto'}}><table style={{width:'100%',minWidth:420,borderCollapse:'collapse'}}>
                  <thead><tr style={{background:C.raised}}>{['#','Strain','Type','Batches','Avg Yield','Best Yield','Total Input','Total Output','Avg $/gram','Best $/gram'].map(function(h,i){return<th key={h} style={{padding:'7px 10px',fontSize:8,fontWeight:700,letterSpacing:1,color:C.dim,textAlign:i>=3?'right':'left',borderBottom:'1px solid '+C.border,whiteSpace:'nowrap'}}>{h}</th>;})}</tr></thead>
                  <tbody>{ranked.map(function(s,i){var tc2=s.type==='Indica'?'#7c6aff':s.type==='Sativa'?'#f5a623':'#4a9eff';return(
                    <tr key={s.strain} style={{background:i%2===0?'transparent':'#0a0a0a',borderLeft:i<3?'3px solid '+C.good:'3px solid transparent'}}>
                      <td style={{padding:'9px 10px',fontSize:12,fontWeight:800,color:i<3?C.good:C.dim}}>{i+1}</td>
                      <td style={{padding:'9px 10px',fontSize:12,fontWeight:700}}>{s.strain}</td>
                      <td style={{padding:'9px 10px'}}><span style={{fontSize:9,fontWeight:700,color:tc2,background:tc2+'22',border:'1px solid '+tc2+'44',borderRadius:2,padding:'1px 5px'}}>{s.type}</span></td>
                      <td style={{padding:'9px 10px',textAlign:'right',fontSize:10,color:C.dim}}>{s.entries}×</td>
                      <td style={{padding:'9px 10px',textAlign:'right',fontSize:13,fontWeight:900,color:s.avgYield>=15?C.good:s.avgYield>=10?C.warn:C.danger}}>{s.avgYield.toFixed(1)}%</td>
                      <td style={{padding:'9px 10px',textAlign:'right',fontSize:11,color:C.muted}}>{s.bestYield.toFixed(1)}%</td>
                      <td style={{padding:'9px 10px',textAlign:'right',fontSize:10,color:C.dim}}>{s.totalInput.toFixed(1)} lbs</td>
                      <td style={{padding:'9px 10px',textAlign:'right',fontSize:11}}>{s.totalOutput.toLocaleString()}g</td>
                      <td style={{padding:'9px 10px',textAlign:'right',fontSize:12,fontWeight:700,color:s.avgCpg<1.5?C.good:s.avgCpg<2.5?C.warn:C.danger}}>${s.avgCpg.toFixed(2)}</td>
                      <td style={{padding:'9px 10px',textAlign:'right',fontSize:10,color:C.good}}>${s.bestCpg.toFixed(2)}</td>
                    </tr>
                  );})}</tbody>
                </table></div>
              </div>
            );
          })()}

          {/* Full Yield Log — sorted by yield desc */}
          {yieldLog.length>0&&(function(){
            var sorted = yieldLog.slice().sort(function(a,b){ return b.yieldPct - a.yieldPct; });
            return(
            <div style={{background:C.surface,border:'1px solid '+C.border,borderRadius:6,overflow:'hidden'}}>
              <div style={{padding:'12px 16px',borderBottom:'1px solid '+C.border}}>
                <div style={{fontSize:9,color:C.dim,letterSpacing:1.5,textTransform:'uppercase'}}>All Entries ({yieldLog.length}) — sorted by yield</div>
              </div>
              <div style={{overflowX:'auto'}}><table style={{width:'100%',minWidth:520,borderCollapse:'collapse'}}>
                <thead><tr style={{background:C.raised}}>{['Date','Strain','Type','Input (lbs)','$/lb','Toll $/lb','Yield %','Output (g)','Total Cost','$/gram','Notes',''].map(function(h,i){return<th key={h+i} style={{padding:'7px 10px',fontSize:8,fontWeight:700,letterSpacing:1,color:C.dim,textAlign:i>=3?'right':'left',borderBottom:'1px solid '+C.border,whiteSpace:'nowrap'}}>{h}</th>;})}</tr></thead>
                <tbody>{sorted.map(function(e,i){return(
                  <tr key={e.id} style={{background:i%2===0?'transparent':'#0a0a0a'}}>
                    <td style={{padding:'8px 10px',fontSize:10,color:C.dim}}>{new Date(e.date).toLocaleDateString()}</td>
                    <td style={{padding:'8px 10px',fontSize:12,fontWeight:600}}>{e.strain}</td>
                    <td style={{padding:'8px 10px',fontSize:9,color:e.type==='Indica'?'#7c6aff':e.type==='Sativa'?'#f5a623':'#4a9eff'}}>{e.type}</td>
                    <td style={{padding:'8px 10px',textAlign:'right',fontSize:11}}>{e.weightLbs}</td>
                    <td style={{padding:'8px 10px',textAlign:'right',fontSize:10,color:C.dim}}>${e.biomassPrice}</td>
                    <td style={{padding:'8px 10px',textAlign:'right',fontSize:10,color:C.dim}}>${e.tollFee}</td>
                    <td style={{padding:'8px 10px',textAlign:'right',fontSize:11,fontWeight:700,color:e.yieldPct>=15?C.good:e.yieldPct>=10?C.warn:C.danger}}>{e.yieldPct}%</td>
                    <td style={{padding:'8px 10px',textAlign:'right',fontSize:11}}>{e.outputGrams.toLocaleString()}g</td>
                    <td style={{padding:'8px 10px',textAlign:'right',fontSize:11}}>${e.totalCost.toLocaleString()}</td>
                    <td style={{padding:'8px 10px',textAlign:'right',fontSize:12,fontWeight:800,color:e.costPerGram<1.5?C.good:e.costPerGram<2.5?C.warn:C.danger}}>${e.costPerGram.toFixed(2)}</td>
                    <td style={{padding:'8px 10px',fontSize:9,color:C.dim,maxWidth:120,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{e.notes||'—'}</td>
                    <td style={{padding:'8px 10px'}}><button onClick={function(){removeEntry(e.id);}} style={{padding:'2px 6px',borderRadius:2,fontSize:8,cursor:'pointer',border:'1px solid '+C.border,background:'transparent',color:C.dim}}>✕</button></td>
                  </tr>
                );})}</tbody>
              </table></div>
            </div>
            );
          })()}
        </div>
      );
    }

    // ── CASH FLOW TAB ─────────────────────────────────────────────────────────
    function CashFlow({C,accounts,periodDays,setPeriodDays,inventoryData}) {
      if (!C) C = DARK_C;
      return (
        <div>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14,flexWrap:'wrap'}}>
            <span style={{fontSize:9,color:C.dim,letterSpacing:1.5,textTransform:'uppercase'}}>Revenue window</span>
            {[7,30,60,90,180,270,365].map(function(d){return<button key={d} onClick={function(){setPeriodDays(d);}} style={{padding:'3px 8px',borderRadius:2,fontSize:10,cursor:'pointer',fontFamily:'inherit',border:'1px solid '+(periodDays===d?C.text:C.border),background:periodDays===d?C.text:'transparent',color:periodDays===d?C.bg:C.dim,fontWeight:periodDays===d?700:400}}>{d}d</button>;})}
          </div>
          <div style={{background:C.surface,border:'1px solid '+(C.borderHi||C.border),borderRadius:8,padding:'40px 24px',textAlign:'center',marginBottom:20}}>
            <div style={{fontSize:13,fontWeight:800,letterSpacing:3,marginBottom:8}}>CASH FLOW</div>
            <div style={{fontSize:11,color:C.muted,lineHeight:1.8,maxWidth:400,margin:'0 auto'}}>Cash flow visualization is being rebuilt for accuracy. Use the P&L tab for current profitability analysis and the Briefing tab for operational overview.</div>
          </div>
        </div>
      );
    }
    const AUTH_KEY = "gpi_auth";
    const AUTH_TTL = 7 * 24 * 60 * 60 * 1000; // 7 days

    function PasswordGate({ children }) {
      const [authed, setAuthed] = useState(false);
      const [pw, setPw] = useState("");
      const [err, setErr] = useState(false);
      const [shake, setShake] = useState(false);
      const [loading, setLoading] = useState(true);
      const inputRef = useRef(null);

      useEffect(function() {
        (async function() {
          try {
            const stored = await window.storage.get(AUTH_KEY);
            if (stored) {
              const parsed = JSON.parse(stored.value);
              if (parsed.expiry && Date.now() < parsed.expiry) {
                setAuthed(true);
              } else {
                await window.storage.delete(AUTH_KEY);
              }
            }
          } catch(e) {}
          setLoading(false);
        })();
      }, []);

      useEffect(function() {
        if (!authed && !loading && inputRef.current) {
          setTimeout(function() { inputRef.current && inputRef.current.focus(); }, 100);
        }
      }, [authed, loading]);

      async function handleSubmit() {
        const match = await checkPass(pw);
        if (match) {
          await window.storage.set(AUTH_KEY, JSON.stringify({ expiry: Date.now() + AUTH_TTL }));
          setAuthed(true);
        } else {
          setErr(true);
          setShake(true);
          setPw("");
          setTimeout(function() { setShake(false); }, 500);
          setTimeout(function() { setErr(false); }, 2000);
          if (inputRef.current) inputRef.current.focus();
        }
      }

      function handleKey(e) { if (e.key === "Enter") handleSubmit(); }

      if (loading) return React.createElement("div", {
        style: { height: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: "#080b12" }
      }, React.createElement("div", { style: { width: 6, height: 6, borderRadius: "50%", background: "#2196f3", opacity: 0.6 } }));

      if (authed) return children;

      return React.createElement("div", {
        style: {
          height: "100vh", display: "flex", flexDirection: "column",
          alignItems: "center", justifyContent: "center",
          background: "#080b12", fontFamily: "'DM Mono','Courier New',monospace",
          backgroundImage: "radial-gradient(ellipse at 50% 0%, rgba(33,150,243,0.08) 0%, transparent 60%)"
        }
      },
        React.createElement("style", null, `
          @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(6px)} }
          @keyframes gateFadeIn { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
          .gate-box { animation: gateFadeIn 0.5s ease; }
          .gate-input:focus { outline: none; border-color: #2196f3 !important; box-shadow: 0 0 0 3px rgba(33,150,243,0.15); }
          .gate-btn:hover { background: #1976d2 !important; }
        `),
        React.createElement("div", { className: "gate-box", style: { width: 320, textAlign: "center" } },
          React.createElement("div", { style: { marginBottom: 32 } },
            React.createElement("img", { src: typeof LOGO_DARK !== 'undefined' ? LOGO_DARK : '', alt: "Globs", style: { height: 80, width: "auto", objectFit: "contain", marginBottom: 12 } }),
            React.createElement("div", { style: { fontSize: 11, letterSpacing: 4, textTransform: "uppercase", color: "#3d4559", marginTop: 8 } }, "Price Intelligence")
          ),
          React.createElement("div", {
            style: {
              background: "#0d1117", border: "1px solid " + (err ? "#f4433644" : "#1e2736"),
              borderRadius: 8, padding: "28px 24px",
              animation: shake ? "shake 0.5s ease" : "none",
              transition: "border-color 0.2s, box-shadow 0.2s",
              boxShadow: err ? "0 0 0 1px #f4433622" : "0 0 40px rgba(33,150,243,0.05)"
            }
          },
            React.createElement("div", { style: { fontSize: 10, color: "#3d4559", letterSpacing: 2, textTransform: "uppercase", marginBottom: 18 } }, "Authorized Access Only"),
            React.createElement("input", {
              ref: inputRef,
              className: "gate-input",
              type: "password",
              value: pw,
              onChange: function(e) { setPw(e.target.value); setErr(false); },
              onKeyDown: handleKey,
              placeholder: "Enter password",
              style: {
                width: "100%", boxSizing: "border-box",
                background: "#080b12", border: "1px solid " + (err ? "#f44336" : "#1e2736"),
                borderRadius: 4, padding: "11px 14px",
                color: "#fff", fontSize: 13, letterSpacing: 2,
                fontFamily: "inherit", marginBottom: 14,
                transition: "all 0.2s"
              }
            }),
            React.createElement("button", {
              className: "gate-btn",
              onClick: handleSubmit,
              style: {
                width: "100%", padding: "11px 0", borderRadius: 4,
                background: "#2196f3", border: "none", color: "#fff",
                fontSize: 11, fontWeight: 700, letterSpacing: 2,
                textTransform: "uppercase", cursor: "pointer",
                transition: "background 0.15s"
              }
            }, "Unlock"),
            err && React.createElement("div", { style: { marginTop: 12, fontSize: 11, color: "#f44336", letterSpacing: 0.5 } }, "Incorrect password")
          ),
          React.createElement("div", { style: { marginTop: 20, fontSize: 9, color: "#1e2736", letterSpacing: 2, textTransform: "uppercase" } }, "GLOBS · CONFIDENTIAL")
        )
      );
    }

    // ── RENDER ────────────────────────────────────────────────────────────────
    const rootEl = document.getElementById('root');
    ReactDOM.createRoot(rootEl).render(
      React.createElement(PasswordGate, null, React.createElement(GPI))
    );
  </script>
</body>
</html>
