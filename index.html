<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Globs Price Intelligence</title>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Globs GPI"/>
  <meta name="theme-color" content="#000000"/>
  <link id="apple-touch-icon" rel="apple-touch-icon" href=""/>
  <link id="gpi-favicon" rel="icon" type="image/png" href=""/>
  <style>
    :root {
      --bg:#000000; --surface:#0a0a0a; --raised:#111111; --border:#1a1a1a; --border-hi:#333333;
      --text:#ffffff; --muted:#999999; --dim:#444444;
      --accent:#ffffff; --accent-glow:rgba(255,255,255,0.08);
      --danger:#ff3333; --danger-bg:#160000; --danger-bdr:#380000;
      --warn:#ff8800; --warn-bg:#1a0e00; --warn-bdr:#3a2000;
      --good:#33cc66; --good-bg:#001a0d; --good-bdr:#004d20;
    }
    body.light-mode {
      --bg:#f0f4f8; --surface:#ffffff; --raised:#e8edf2; --border:#d1dbe6; --border-hi:#a8bdd0;
      --text:#0a1628; --muted:#3d5a7a; --dim:#8aa0b8;
      --accent:#1565c0; --accent-glow:rgba(21,101,192,0.1);
      --danger:#d32f2f; --danger-bg:#ffebee; --danger-bdr:#ef9a9a;
      --warn:#e65100; --warn-bg:#fff3e0; --warn-bdr:#ffcc02;
      --good:#2e7d32; --good-bg:#e8f5e9; --good-bdr:#a5d6a7;
    }
    body { margin:0; padding:0; background:var(--bg); font-family:'DM Mono','Courier New',monospace; color:var(--text); }

    /* Starlink-style scrollbar */
    ::-webkit-scrollbar { width:4px; height:4px; background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--border-hi); border-radius:2px; }
    ::-webkit-scrollbar-track { background:transparent; }
    * { box-sizing:border-box; }
    input::placeholder { color:var(--dim); }
    textarea::placeholder { color:var(--dim); }

    /* Account row mobile responsive */
    .acct-row-header{display:flex;align-items:center;padding:11px 20px;cursor:pointer;gap:14px;flex-wrap:nowrap;transition:background 0.15s;}
    .acct-info{flex:1;min-width:0;}
    .acct-stats{display:flex;align-items:center;gap:10px;flex-shrink:0;}
    .acct-stat{text-align:right;}
    .acct-stat-rev{min-width:72px;}
    .acct-stat-skus{min-width:60px;}
    .acct-badge-col{min-width:110px;text-align:right;}
    @media(max-width:600px){
      .acct-row-header{flex-wrap:wrap;padding:12px 14px;gap:6px;}
      .acct-info{width:calc(100% - 24px);}
      .acct-stats{width:100%;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:4px;}
      .acct-stat{text-align:left;}
      .acct-stat-rev,.acct-stat-skus,.acct-badge-col{min-width:0;text-align:left;}
      .acct-stat-label{font-size:8px;}
      .acct-stat-value{font-size:13px;}
    }

    /* Missile arc animation */
    @keyframes dash {
      to { stroke-dashoffset: 0; }
    }
    @keyframes pulse-dot {
      0%,100% { r:4; opacity:1; }
      50% { r:7; opacity:0.6; }
    }
    @keyframes map-fade-out {
      0% { opacity:1; transform:scale(1); }
      70% { opacity:1; transform:scale(1); }
      100% { opacity:0; transform:scale(0.96); }
    }
    @keyframes float-up {
      0% { opacity:0; transform:translateY(10px); }
      100% { opacity:1; transform:translateY(0); }
    }
    .map-screen { animation: map-fade-out 6s ease-in-out forwards; }
    .dispatch-arc { animation: dash 2s ease-out forwards; }
    .zone-pulse { animation: pulse-dot 1.5s ease-in-out infinite; }
    .fade-in { animation: float-up 0.5s ease-out forwards; }

    /* Theme toggle */
    .theme-toggle { background:none; border:1px solid var(--border-hi); border-radius:20px; padding:4px 12px; cursor:pointer; font-size:10px; color:var(--muted); font-family:inherit; letter-spacing:1px; transition:all 0.2s; }
    .theme-toggle:hover { border-color:var(--text); color:var(--text); }
  </style>

  <!-- localStorage shim — replaces Claude's window.storage API -->
  <script>
    var PFX = 'gpi:';
    window.storage = {
      get: async function(key) {
        try { var v = localStorage.getItem(PFX+key); return v ? { key:key, value:v } : null; } catch(e) { return null; }
      },
      set: async function(key, value) {
        try { localStorage.setItem(PFX+key, value); return { key:key, value:value }; } catch(e) { return null; }
      },
      delete: async function(key) {
        try { localStorage.removeItem(PFX+key); return { key:key, deleted:true }; } catch(e) { return null; }
      },
      list: async function(prefix) {
        try {
          var keys = Object.keys(localStorage)
            .filter(function(k){ return k.startsWith(PFX+(prefix||'')); })
            .map(function(k){ return k.slice(PFX.length); });
          return { keys:keys };
        } catch(e) { return { keys:[] }; }
      }
    };
  </script>

  <script type="text/babel" data-presets="react">
    // ─── Hooks from global React ──────────────────────────────────────────────
    const { useState, useEffect, useRef, useMemo } = React;

    // ── CSV PARSER ────────────────────────────────────────────────────────────
    function parseCSVRFC4180(text) {
      const rows = []; let row = [], field = "", inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (inQuotes) {
          if (ch === '"' && text[i+1] === '"') { field += '"'; i++; }
          else if (ch === '"') inQuotes = false;
          else field += ch;
        } else {
          if (ch === '"') inQuotes = true;
          else if (ch === ',') { row.push(field.trim()); field = ""; }
          else if (ch === '\r' && text[i+1] === '\n') { i++; row.push(field.trim()); rows.push(row); row = []; field = ""; }
          else if (ch === '\n' || ch === '\r') { row.push(field.trim()); rows.push(row); row = []; field = ""; }
          else field += ch;
        }
      }
      if (field || row.length > 0) { row.push(field.trim()); rows.push(row); }
      return rows.filter(r => r.some(c => c.length > 0));
    }

    function getQuarter(d) {
      if (!d) return null;
      const dt = new Date(d); if (isNaN(dt.getTime())) return null;
      return "Q" + Math.ceil((dt.getMonth()+1)/3) + " " + dt.getFullYear();
    }
    function quarterOrder(q) { const m = q && q.match(/Q(\d) (\d{4})/); return m ? parseInt(m[2])*10+parseInt(m[1]) : 0; }

    function parseAccountActivityCSV(text) {
      const all = parseCSVRFC4180(text); if (!all.length) return [];
      const hi = all.findIndex(r => r.some(c => c.toLowerCase().replace(/\n/g," ").includes("related account")));
      if (hi < 0) return [];
      const hdr = all[hi].map(h => h.toLowerCase().replace(/\n/g," ").trim());
      const ci = function(kw) { return hdr.findIndex(h => h.includes(kw)); };
      const COL = { conf:0, acc:ci("related account"), allLoc:ci("all locations"), ev:6, sd:4, ed:5, rep:ci("sales rep"), zone:ci("zone"), sales:ci("total sales"), months:ci("number of month"), pct:ci("% off"), req:19 };
      const accs = {};
      all.slice(hi+1).forEach(function(row) {
        if (row.length < 10) return;
        const name = row[COL.acc] && row[COL.acc].trim(); if (!name || name.length < 2) return;
        const rep = (row[COL.rep] && row[COL.rep].trim()) || "";
        const zone = (row[COL.zone] && row[COL.zone].trim()) || "";
        const allLocs = row[COL.allLoc] && row[COL.allLoc].trim().toUpperCase() === "TRUE";
        const sales = parseFloat((row[COL.sales] || "").replace(/[$,"]/g,"").trim()) || 0;
        const months = parseFloat((row[COL.months] || "").replace(/,/g,"").trim()) || 0;
        const promo = {
          confirmation: (row[COL.conf] && row[COL.conf].trim()) || "",
          event: (row[COL.ev] && row[COL.ev].trim()) || "",
          startDate: (row[COL.sd] && row[COL.sd].trim()) || "",
          endDate: (row[COL.ed] && row[COL.ed].trim()) || "",
          pctOff: (row[COL.pct] && row[COL.pct].trim()) || "",
          reqDays: (row[COL.req] && row[COL.req].trim()) || "",
          quarter: getQuarter(row[COL.sd] && row[COL.sd].trim())
        };
        const key = name.replace(/\s*-\s*Redwood City$/i,' Redwood City').replace(/\s*-\s*Corporate$/i,' - Corporate').trim();
        if (!accs[key]) {
          accs[key] = { name:key, rep:rep, zone:zone, allLocations:allLocs, totalSales:sales, months:months, hasSalesData:sales>0, promotions:promo.quarter?[promo]:[] };
        } else {
          if (sales > accs[key].totalSales) { accs[key].totalSales=sales; accs[key].hasSalesData=sales>0; }
          if (months > accs[key].months) accs[key].months=months;
          if (rep && !accs[key].rep) accs[key].rep=rep;
          if (zone && !accs[key].zone) accs[key].zone=zone;
          if (allLocs) accs[key].allLocations=true;
          if (promo.quarter) accs[key].promotions.push(promo);
        }
      });
      return Object.values(accs).filter(a => !["related account","brand"].includes(a.name.toLowerCase())).sort((a,b) => b.totalSales-a.totalSales);
    }

    function parseAccountActivity90Day(text) {
      const all = parseCSVRFC4180(text); if (!all.length) return [];
      const hi = all.findIndex(r => r.some(c => c.toLowerCase().includes("customer site sold to")));
      if (hi < 0) return [];
      const accs = {}, soMap = {};
      all.slice(hi+1).forEach(function(row) {
        if (row.length < 11) return;
        const sku=row[0]&&row[0].trim(), account=row[1]&&row[1].trim(), rep=(row[2]&&row[2].trim())||"";
        const date=(row[3]&&row[3].trim())||"", zone=(row[11]&&row[11].trim())||"";
        const soNum=(row[10]&&row[10].trim())||"", category=(row[4]&&row[4].trim())||"";
        if (!account||!sku||!sku.toLowerCase().startsWith("globs")) return;
        const extPrice=parseFloat((row[6]||"").replace(/[$,]/g,"").trim())||0;
        const qty=parseFloat((row[5]||"").trim())||0;
        const price=(qty>0&&extPrice>0)?+(extPrice/qty).toFixed(2):0;
        if (Math.abs(extPrice)<0.05&&qty<=1) return;
        const mk=account+"|||"+sku;
        if (!soMap[mk]) soMap[mk]=new Set(); if (soNum) soMap[mk].add(soNum);
        if (!accs[account]) {
          accs[account]={name:account,rep:rep,zone:zone,totalSales:0,months:3,hasSalesData:true,allLocations:false,promotions:[],soNumbers:new Set(),orderedSkus:[],totalQty:0,catRevenue90:{},soDates:{},_rows:[]};
        }
        const a=accs[account];
        if (rep&&!a.rep) a.rep=rep; if (zone&&!a.zone) a.zone=zone;
        if (soNum) a.soNumbers.add(soNum); if (soNum&&date&&!a.soDates[soNum]) a.soDates[soNum]=date;
        if (extPrice>0) { a.totalSales+=extPrice; a.totalQty+=qty; a._rows.push({date:date,qty:qty,extPrice:extPrice,category:category,sku:sku}); }
        const strain=sku.replace(/^Globs\s*-\s*/i,"").split(" - ")[0].trim();
        const ex=a.orderedSkus.find(s => s.sku===sku);
        if (ex) {
          if (extPrice>0) { ex.totalQty=(ex.totalQty||0)+qty; if(price>0) ex.wholesale=price; }
          if (date) { if(!ex.firstDate||date<ex.firstDate) ex.firstDate=date; if(!ex.lastDate||date>ex.lastDate) ex.lastDate=date; }
        } else {
          a.orderedSkus.push({sku:sku,strain:strain,category:category,wholesale:price,qty:qty,totalQty:extPrice>0?qty:0,firstDate:date||"",lastDate:date||""});
        }
      });
      const PERIODS=[30,60,90,180,270,365];
      let fMax=0;
      Object.values(accs).forEach(function(a) {
        (a._rows||[]).forEach(function(r) {
          if (!r.date) return;
          const p=r.date.split('/');
          const ts=new Date(parseInt(p[2]),parseInt(p[0])-1,parseInt(p[1])).getTime();
          if (!isNaN(ts)&&ts>fMax) fMax=ts;
        });
      });
      if (!fMax) fMax=Date.now();
      const cutoff={};
      PERIODS.forEach(function(d) { cutoff[d]=fMax-d*86400000; });
      Object.values(accs).forEach(function(a) {
        a.periodRevenue={30:0,60:0,90:0,180:0,270:0,365:0};
        a.periodCatRevenue={30:{},60:{},90:{},180:{},270:{},365:{}};
        a.skuPeriodUnits={};
        (a._rows||[]).forEach(function(r) {
          if (!r.date||!r.extPrice) return;
          const pts=r.date.split('/');
          const ts=new Date(parseInt(pts[2]),parseInt(pts[0])-1,parseInt(pts[1])).getTime();
          if (isNaN(ts)) return;
          PERIODS.forEach(function(d) {
            if (ts>=cutoff[d]) {
              a.periodRevenue[d]+=r.extPrice;
              const ck=r.category||"Other";
              a.periodCatRevenue[d][ck]=(a.periodCatRevenue[d][ck]||0)+r.extPrice;
              if (r.sku) {
                if (!a.skuPeriodUnits[r.sku]) a.skuPeriodUnits[r.sku]={30:0,60:0,90:0,180:0,270:0,365:0};
                a.skuPeriodUnits[r.sku][d]=(a.skuPeriodUnits[r.sku][d]||0)+(r.qty||0);
              }
            }
          });
        });
        a.revenue90=a.periodRevenue[90]; a.catRevenue90=a.periodCatRevenue[90];
        const ods={};
        (a._rows||[]).forEach(function(r) {
          if (!r.date||!r.extPrice||r.extPrice<=0) return;
          const p=r.date.split('/'); if(p.length!==3) return;
          const ts=new Date(parseInt(p[2]),parseInt(p[0])-1,parseInt(p[1])).getTime();
          if (!isNaN(ts)) ods[ts]=true;
        });
        a.orderDayTs=Object.keys(ods).map(Number).sort(function(a,b){return a-b;});
        delete a._rows;
      });
      const SUP=["upnorth samples","internal","test account"];
      return Object.values(accs)
        .filter(function(a) {
          if (!a.name||a.name.toLowerCase()==="customer site sold to") return false;
          return !SUP.some(function(k){return a.name.toLowerCase().includes(k);});
        })
        .map(function(a) {
          return Object.assign({},a,{
            soNumbers: Array.from(a.soNumbers),
            skuPrices: Object.fromEntries((a.orderedSkus||[]).filter(s=>s.wholesale>0).map(s=>[s.sku,s.wholesale])),
            orderedSkus: a.orderedSkus.map(function(s) {
              return Object.assign({},s,{
                orderCount: (soMap[a.name+"|||"+s.sku]&&soMap[a.name+"|||"+s.sku].size)||1,
                soldThrough: ((soMap[a.name+"|||"+s.sku]&&soMap[a.name+"|||"+s.sku].size)||1)>=2,
                periodUnits: (a.skuPeriodUnits&&a.skuPeriodUnits[s.sku])||{}
              });
            })
          });
        })
        .sort(function(a,b){return b.totalSales-a.totalSales;});
    }

    function parseCurrentInventory(text) {
      const all=parseCSVRFC4180(text); const result={};
      all.slice(3).forEach(function(row) {
        const sku=row[0]&&row[0].trim();
        if (!sku||!sku.toLowerCase().startsWith("globs")||sku.toLowerCase().includes("battery")) return;
        result[sku]={onHand:parseInt((row[6]||"").trim())||0,pkgDate:(row[2]&&row[2].trim())||"",daysOld:(row[3]&&row[3].trim())||"",batch:(row[4]&&row[4].trim())||"",thc:(row[5]&&row[5].trim())||""};
      });
      return result;
    }

    function parseCSV(text) {
      const p=text.slice(0,800).toLowerCase();
      if (p.includes("pkg date")||p.includes("days since pkgd")) return {type:"inventory",data:parseCurrentInventory(text)};
      if (p.includes("customer site sold to")) return {type:"account90",data:parseAccountActivity90Day(text)};
      if (p.includes("related account")||p.includes("sales rep")) return {type:"account",data:parseAccountActivityCSV(text)};
      return {type:"unknown",data:[]};
    }

    // ── CONSTANTS ─────────────────────────────────────────────────────────────
    const DARK_C = {

      text:"#0a1628",muted:"#3d5a7a",dim:"#8aa0b8",

      warn:"#e65100",warnBg:"#fff3e0",warnBdr:"#ffcc80",
      good:"#2e7d32",goodBg:"#e8f5e9",goodBdr:"#a5d6a7",
      accent:"#1565c0",accentGlow:"rgba(21,101,192,0.1)"
    };
    const C = DARK_C; // default; GPI component overrides per theme
    const COGS = {
      Cart:{label:"Vape Cart",wholesale:10,cost:4.82,distroRate:0.16},
      Diamonds:{label:"Diamonds",wholesale:10,cost:3.86,distroRate:0.16},
      Badder:{label:"Badder",wholesale:8,cost:3.36,distroRate:0.16},
      Sauce:{label:"Sauce",wholesale:8,cost:3.36,distroRate:0.16},
      Shatter:{label:"Shatter",wholesale:7,cost:3.36,distroRate:0.16},
      Other:{label:"Other",wholesale:8.5,cost:3.85,distroRate:0.16}
    };
    function cogsFor(cat) {
      const c=(cat||"").toLowerCase();
      if(c.includes("cart")||c.includes("vape"))return COGS.Cart;
      if(c.includes("diamond"))return COGS.Diamonds;
      if(c.includes("badder"))return COGS.Badder;
      if(c.includes("sauce"))return COGS.Sauce;
      if(c.includes("shatter"))return COGS.Shatter;
      return COGS.Other;
    }
    const PKG = {

    function markupAnalysis(retail,ws,tax) { if(!ws||!retail||ws<1)return null; const raw=+(retail/ws).toFixed(2),consumer=+(retail*(1+tax)).toFixed(2),aligned=raw>=2&&raw<=2.5; return{raw,consumer,aligned,label:aligned?"aligned":raw<2?"below target":"above target"}; }
    function computeTier(orderDayTs) {
      const ts=(orderDayTs||[]).slice().sort(function(a,b){return a-b;}); const n=ts.length,now=Date.now();
      if(n<1)return{label:"New",color:"#888",bg:"#111",border:"#2a2a2a"};
      const span=n>1?(ts[n-1]-ts[0])/86400000:0,daysSince=(now-ts[n-1])/86400000;
      const gaps=[]; for(let i=1;i<n;i++)gaps.push((ts[i]-ts[i-1])/86400000);
      const avg=gaps.length?gaps.reduce(function(s,g){return s+g;},0)/gaps.length:999;
      if(n>=5&&avg<=35&&span>=120&&daysSince<=90)return{label:"Legacy",color:"#c9a84c",bg:"#1a1400",border:"#3d3000"};
      if(n>=2&&daysSince<=120)return{label:"On The Rise",color:"#4cade0",bg:"#001420",border:"#003050"};
      return{label:"New",color:"#888",bg:"#111",border:"#2a2a2a"};
    }
    function computeCadence(orderDayTs) {
      if(!orderDayTs||orderDayTs.length<2)return{cadenceDays:null,lastOrderDate:""};
      const ts=[].concat(orderDayTs).sort(function(a,b){return a-b;}),gaps=[];
      for(let i=1;i<ts.length;i++)gaps.push((ts[i]-ts[i-1])/86400000);
      const cd=Math.round(gaps.reduce(function(s,g){return s+g;},0)/gaps.length);
      const ld=new Date(ts[ts.length-1]);
      const mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      return{cadenceDays:cd,lastOrderDate:mo[ld.getMonth()]+' '+ld.getDate()};
    }

    // ── CASH FLOW TAB ─────────────────────────────────────────────────────────
    function CashFlow({C}) {
      if (!C) C = DARK_C; // fallback
      const STORE_KEY = 'gpi-cashflow-entries';
      const [entries, setEntries] = useState([]);
      const [loading, setLoading] = useState(true);
      const [showForm, setShowForm] = useState(false);
      const [form, setForm] = useState({date:'',vendor:'',invoiceNum:'',type:'expense',category:'',description:'',amount:'',notes:''});
      const [fileError, setFileError] = useState('');
      const [filter, setFilter] = useState('all');
      const [scanning, setScanning] = useState(false);
      const fileRef = useRef();

      const CATS = {
        expense: ['Production / COGS','Packaging Materials','Distribution Fees','Lab Testing','Marketing','Rent / Overhead','Equipment','Legal / Compliance','Payroll','Other Expense'],
        income:  ['Wholesale Revenue','Consignment Revenue','Promo Credits','Refund / Return','Other Income']
      };

      useEffect(function() {
        async function load() {
          try { const r = await window.storage.get(STORE_KEY); if (r) setEntries(JSON.parse(r.value)); } catch(e) {}
          setLoading(false);
        }
        load();
      }, []);

      async function save(next) {
        setEntries(next);
        try { await window.storage.set(STORE_KEY, JSON.stringify(next)); } catch(e) {}
      }

      async function scanImageInvoice(file) {
        setScanning(true);
        setFileError('🔍 Scanning invoice with AI...');
        try {
          const b64 = await new Promise(function(res, rej) {
            const r = new FileReader();
            r.onload = function(e) { res(e.target.result.split(',')[1]); };
            r.onerror = rej;
            r.readAsDataURL(file);
          });
          const mt = file.type === 'application/pdf' ? 'application/pdf' : (file.type || 'image/jpeg');
          const resp = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              model: 'claude-sonnet-4-20250514',
              max_tokens: 500,
              messages: [{
                role: 'user',
                content: [
                  { type: mt === 'application/pdf' ? 'document' : 'image',
                    source: { type: 'base64', media_type: mt, data: b64 } },
                  { type: 'text', text: 'Extract invoice data. Respond ONLY with JSON, no markdown:\n{"vendor":"","invoiceNum":"","date":"YYYY-MM-DD","amount":0,"description":"","category":"","type":"expense"}' }
                ]
              }]
            })
          });
          const data = await resp.json();
          const raw = (data.content||[]).find(function(c){return c.type==='text';});
          if (!raw) throw new Error('No response from AI');
          const clean = raw.text.replace(/```json|```/g,'').trim();
          const parsed = JSON.parse(clean);
          setForm(function(prev) {
            return Object.assign({}, prev, {
              vendor: parsed.vendor || prev.vendor,
              invoiceNum: parsed.invoiceNum || prev.invoiceNum,
              date: parsed.date || prev.date,
              amount: parsed.amount ? String(parsed.amount) : prev.amount,
              description: parsed.description || prev.description,
              category: parsed.category || prev.category,
              type: parsed.type || 'expense'
            });
          });
          setShowForm(true);
          setFileError('✓ Invoice scanned — review and save below');
        } catch(err) {
          setFileError('⚠ AI scan failed: ' + err.message + ' — try manual entry');
        } finally {
          setScanning(false);
        }
      }

      function handleFileUpload(e) {
        const file = e.target.files[0]; if (!file) return;
        setFileError('');
        const isImage = file.type.startsWith('image/');
        const isPdf = file.type === 'application/pdf';
        if (isImage || isPdf) {
          scanImageInvoice(file);
          e.target.value = '';
          return;
        }
        const reader = new FileReader();
        reader.onload = function(ev) {
          try {
            const text = ev.target.result;
            const rows = parseCSVRFC4180(text);
            if (rows.length < 2) { setFileError('No data rows found'); return; }
            const hdr = rows[0].map(function(h) { return h.toLowerCase().trim(); });
            const gi = function(kw) { return hdr.findIndex(function(h) { return h.includes(kw); }); };
            const cols = { date: gi('date'), vendor: gi('vendor'), invoice: gi('invoice'), type: gi('type'), category: gi('category'), description: gi('desc'), amount: gi('amount'), notes: gi('note') };
            const parsed = [];
            rows.slice(1).forEach(function(row) {
              const amount = parseFloat((row[cols.amount] || '').replace(/[$,]/g, '')) || 0;
              if (!amount) return;
              parsed.push({
                id: Date.now() + Math.random(),
                date: (row[cols.date] || '').trim(),
                vendor: (row[cols.vendor] || '').trim(),
                invoiceNum: (row[cols.invoice >= 0 ? cols.invoice : -1] || '').trim(),
                type: (row[cols.type] || '').toLowerCase().includes('income') ? 'income' : 'expense',
                category: (row[cols.category] || '').trim(),
                description: (row[cols.description >= 0 ? cols.description : -1] || '').trim(),
                amount: amount,
                notes: (row[cols.notes >= 0 ? cols.notes : -1] || '').trim(),
                source: 'import'
              });
            });
            if (!parsed.length) { setFileError('No valid rows parsed — check column headers'); return; }
            const next = entries.concat(parsed).sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
            save(next);
            setFileError('✓ Imported ' + parsed.length + ' entries');
          } catch(err) { setFileError('Parse error: ' + err.message); }
        };
        reader.readAsText(file); e.target.value = '';
      }

      function submitEntry() {
        if (!form.date || !form.amount || !form.vendor) return;
        const entry = Object.assign({}, form, { id: Date.now(), amount: parseFloat(form.amount) || 0, source: 'manual' });
        const next = [entry].concat(entries).sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
        save(next);
        setForm({date:'',vendor:'',invoiceNum:'',type:'expense',category:'',description:'',amount:'',notes:''});
        setShowForm(false);
      }

      function deleteEntry(id) { save(entries.filter(function(e) { return e.id !== id; })); }

      const filtered = useMemo(function() {
        if (filter === 'all') return entries;
        return entries.filter(function(e) { return e.type === filter; });
      }, [entries, filter]);

      const totalIncome = useMemo(function() { return entries.filter(function(e){return e.type==='income';}).reduce(function(s,e){return s+e.amount;},0); }, [entries]);
      const totalExpense = useMemo(function() { return entries.filter(function(e){return e.type==='expense';}).reduce(function(s,e){return s+e.amount;},0); }, [entries]);
      const netCash = totalIncome - totalExpense;

      // Monthly summary
      const monthlySummary = useMemo(function() {
        const map = {};
        entries.forEach(function(e) {
          if (!e.date) return;
          const mo = e.date.slice(0, 7);
          if (!map[mo]) map[mo] = { month: mo, income: 0, expense: 0 };
          if (e.type === 'income') map[mo].income += e.amount;
          else map[mo].expense += e.amount;
        });
        return Object.values(map).sort(function(a,b){return b.month.localeCompare(a.month);}).slice(0, 12);
      }, [entries]);

      // Category breakdown
      const catBreakdown = useMemo(function() {
        const map = {};
        entries.filter(function(e){return e.type==='expense';}).forEach(function(e) {
          const cat = e.category || 'Uncategorized';
          map[cat] = (map[cat] || 0) + e.amount;
        });
        return Object.entries(map).sort(function(a,b){return b[1]-a[1];});
      }, [entries]);

      const inpSt = { background: C.bg, border: '1px solid '+C.border, borderRadius: 3, color: C.text, fontSize: 12, fontFamily: 'inherit', padding: '7px 10px', outline: 'none', width: '100%' };
      const selSt = Object.assign({}, inpSt, { cursor: 'pointer' });

      if (loading) return <div style={{padding:40,color:C.dim,fontSize:12}}>Loading…</div>;

      return (
        <div>
          {/* KPI strip */}
          <div style={{display:'flex',gap:12,marginBottom:24,flexWrap:'wrap'}}>
            {[{l:'Total Income',v:totalIncome,color:C.good},{l:'Total Expenses',v:totalExpense,color:C.danger},{l:'Net Cash Flow',v:netCash,color:netCash>=0?C.good:C.danger,alert:netCash<0}].map(function(it){return(
              <div key={it.l} style={{background:it.alert?C.dangerBg:C.surface,border:'1px solid '+(it.alert?C.dangerBdr:C.border),borderRadius:6,padding:'18px 24px',flex:1,minWidth:160}}>
                <div style={{fontSize:9,color:C.dim,letterSpacing:1.5,textTransform:'uppercase',marginBottom:6}}>{it.l}</div>
                <div style={{fontSize:28,fontWeight:800,color:it.color,lineHeight:1}}>{curK(Math.abs(it.v))}</div>
                {it.l==='Net Cash Flow'&&<div style={{fontSize:9,color:C.dim,marginTop:4}}>{it.v>=0?'positive cash position':'⚠ cash gap — review expenses'}</div>}
              </div>
            );})}
            <div style={{background:C.surface,border:'1px solid '+C.border,borderRadius:6,padding:'18px 24px',flex:1,minWidth:160}}>
              <div style={{fontSize:9,color:C.dim,letterSpacing:1.5,textTransform:'uppercase',marginBottom:6}}>Entries</div>
              <div style={{fontSize:28,fontWeight:800,color:C.text,lineHeight:1}}>{entries.length}</div>
              <div style={{fontSize:9,color:C.dim,marginTop:4}}>{entries.filter(function(e){return e.type==='income';}).length} income · {entries.filter(function(e){return e.type==='expense';}).length} expense</div>
            </div>
          </div>

          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:18,marginBottom:24}}>
            {/* Monthly summary */}
            {monthlySummary.length>0&&(
              <div style={{background:C.surface,border:'1px solid '+C.border,borderRadius:6,padding:'18px 20px'}}>
                <div style={{fontSize:9,color:C.dim,letterSpacing:1.5,textTransform:'uppercase',marginBottom:14}}>Monthly Summary</div>
                <div style={{overflowX:'auto'}}>
                  <table style={{width:'100%',minWidth:320,borderCollapse:'collapse'}}>
                    <thead><tr>{['Month','Income','Expenses','Net'].map(function(h,i){return<th key={h} style={{padding:'5px 8px',fontSize:8,fontWeight:700,letterSpacing:1,textTransform:'uppercase',color:C.dim,textAlign:i===0?'left':'right',borderBottom:'1px solid '+C.border}}>{h}</th>;})}</tr></thead>
                    <tbody>{monthlySummary.map(function(m,i){const net=m.income-m.expense;return(<tr key={m.month} style={{background:i%2===0?'transparent':C.raised}}><td style={{padding:'7px 8px',fontSize:11}}>{m.month}</td><td style={{padding:'7px 8px',textAlign:'right',fontSize:11,color:C.good}}>{curK(m.income)}</td><td style={{padding:'7px 8px',textAlign:'right',fontSize:11,color:C.danger}}>{curK(m.expense)}</td><td style={{padding:'7px 8px',textAlign:'right',fontSize:11,fontWeight:700,color:net>=0?C.good:C.danger}}>{curK(Math.abs(net))}{net<0?' ▼':' ▲'}</td></tr>);})}</tbody>
                  </table>
                </div>
              </div>
            )}
            {/* Expense breakdown */}
            {catBreakdown.length>0&&(
              <div style={{background:C.surface,border:'1px solid '+C.border,borderRadius:6,padding:'18px 20px'}}>
                <div style={{fontSize:9,color:C.dim,letterSpacing:1.5,textTransform:'uppercase',marginBottom:14}}>Expense Breakdown</div>
                {catBreakdown.map(function(ce,i){const pct=totalExpense>0?ce[1]/totalExpense*100:0;return(
                  <div key={ce[0]} style={{marginBottom:10}}>
                    <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}><span style={{fontSize:10,color:C.muted}}>{ce[0]}</span><span style={{fontSize:11,fontWeight:700,color:C.text}}>{curK(ce[1])}<span style={{fontSize:9,color:C.dim,marginLeft:6}}>{pct.toFixed(0)}%</span></span></div>
                    <div style={{height:4,background:C.raised,borderRadius:2,overflow:'hidden'}}><div style={{height:'100%',width:pct+'%',background:C.danger,borderRadius:2,transition:'width 0.3s'}}/></div>
                  </div>
                );})}
              </div>
            )}
          </div>

          {/* Action bar */}
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:16,flexWrap:'wrap'}}>
            <div style={{display:'flex',gap:4}}>
              {[['all','All'],['income','Income'],['expense','Expenses']].map(function(fl){return<button key={fl[0]} onClick={function(){setFilter(fl[0]);}} style={{padding:'5px 12px',borderRadius:3,fontSize:10,cursor:'pointer',fontFamily:'inherit',border:'1px solid '+(filter===fl[0]?C.text:C.border),background:filter===fl[0]?C.text:'transparent',color:filter===fl[0]?C.bg:C.dim,fontWeight:filter===fl[0]?700:400}}>{fl[1]}</button>;})}
            </div>
            <div style={{marginLeft:'auto',display:'flex',gap:8,alignItems:'center'}}>
              {scanning&&<span style={{fontSize:10,color:'#2196f3',animation:'pulse 1s infinite',letterSpacing:0.5}}>🔍 Scanning…</span>}
              <input ref={fileRef} type="file" accept=".csv,.jpg,.jpeg,.png,.pdf,.heic" onChange={handleFileUpload} style={{display:'none'}}/>
              <button onClick={function(){fileRef.current&&fileRef.current.click();}} disabled={scanning} style={{padding:'6px 14px',borderRadius:3,fontSize:11,fontWeight:600,cursor:scanning?'wait':'pointer',border:'1px solid '+C.border,background:'transparent',color:scanning?C.dim:C.muted,transition:'all 0.15s'}}>
                {scanning?'Scanning…':'📄 Upload Invoice / CSV'}
              </button>
              <button onClick={function(){setShowForm(!showForm);}} style={{padding:'6px 14px',borderRadius:3,fontSize:11,fontWeight:700,cursor:'pointer',border:'none',background:C.text,color:C.bg}}>+ Add Entry</button>
            </div>
          </div>
          {fileError&&<div style={{marginBottom:12,fontSize:11,color:fileError.startsWith('✓')?C.good:fileError.startsWith('🔍')?'#2196f3':C.danger,background:fileError.startsWith('✓')?C.goodBg:fileError.startsWith('🔍')?'rgba(33,150,243,0.08)':C.dangerBg,border:'1px solid '+(fileError.startsWith('✓')?C.goodBdr:fileError.startsWith('🔍')?'#2196f344':C.dangerBdr),padding:'8px 12px',borderRadius:4}}>{fileError}</div>}

          {/* Add entry form */}
          {showForm&&(
            <div style={{background:C.surface,border:'1px solid '+C.borderHi,borderRadius:6,padding:20,marginBottom:20}}>
              <div style={{fontSize:11,fontWeight:700,letterSpacing:1.5,textTransform:'uppercase',marginBottom:16,color:C.muted}}>New Entry</div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(180px,1fr))',gap:12,marginBottom:12}}>
                {[{label:'Date *',key:'date',type:'date'},{label:'Vendor / Source *',key:'vendor',type:'text',placeholder:'e.g. Uline, Greenline'},{label:'Invoice #',key:'invoiceNum',type:'text',placeholder:'INV-001'},{label:'Amount * ($)',key:'amount',type:'number',placeholder:'0.00'},{label:'Description',key:'description',type:'text',placeholder:'Brief description'}].map(function(f){return(
                  <div key={f.key}>
                    <div style={{fontSize:9,color:C.dim,letterSpacing:1,marginBottom:4}}>{f.label.toUpperCase()}</div>
                    <input type={f.type} placeholder={f.placeholder||''} value={form[f.key]} onChange={function(e){setForm(Object.assign({},form,{[f.key]:e.target.value}));}} style={inpSt}/>
                  </div>
                );})}
                <div>
                  <div style={{fontSize:9,color:C.dim,letterSpacing:1,marginBottom:4}}>TYPE *</div>
                  <select value={form.type} onChange={function(e){setForm(Object.assign({},form,{type:e.target.value,category:''}));}} style={Object.assign({},selSt,{background:C.bg})}>
                    <option value="expense">Expense</option>
                    <option value="income">Income</option>
                  </select>
                </div>
                <div>
                  <div style={{fontSize:9,color:C.dim,letterSpacing:1,marginBottom:4}}>CATEGORY</div>
                  <select value={form.category} onChange={function(e){setForm(Object.assign({},form,{category:e.target.value}));}} style={Object.assign({},selSt,{background:C.bg})}>
                    <option value="">Select…</option>
                    {(CATS[form.type]||[]).map(function(c){return<option key={c} value={c}>{c}</option>;})}
                  </select>
                </div>
                <div style={{gridColumn:'1/-1'}}>
                  <div style={{fontSize:9,color:C.dim,letterSpacing:1,marginBottom:4}}>NOTES</div>
                  <input placeholder="Optional notes..." value={form.notes} onChange={function(e){setForm(Object.assign({},form,{notes:e.target.value}));}} style={inpSt}/>
                </div>
              </div>
              <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
                <button onClick={function(){setShowForm(false);}} style={{padding:'6px 14px',borderRadius:3,fontSize:11,cursor:'pointer',border:'1px solid '+C.border,background:'transparent',color:C.dim}}>Cancel</button>
                <button onClick={submitEntry} disabled={!form.date||!form.amount||!form.vendor} style={{padding:'6px 14px',borderRadius:3,fontSize:11,fontWeight:700,cursor:'pointer',border:'none',background:C.text,color:C.bg,opacity:(!form.date||!form.amount||!form.vendor)?0.5:1}}>Save Entry</button>
              </div>
            </div>
          )}

          {/* CSV template hint */}
          {entries.length===0&&(
            <div style={{background:C.surface,border:'1px solid '+C.border,borderRadius:6,padding:'18px 20px',marginBottom:20,fontSize:11,color:C.muted,lineHeight:2}}>
              <strong style={{color:C.text}}>Getting started:</strong> Click <strong style={{color:C.text}}>+ Add Entry</strong> to log individual invoices, or <strong style={{color:C.text}}>Upload Invoice / CSV</strong> to bulk import.<br/>
              CSV format: <span style={{fontFamily:'monospace',color:C.dim}}>date, vendor, invoice, type, category, description, amount, notes</span>
            </div>
          )}

          {/* Entries table */}
          {filtered.length>0&&(
            <div style={{border:'1px solid '+C.border,borderRadius:6,overflow:'hidden'}}>
              <div style={{overflowX:'auto'}}>
                <table style={{width:'100%',minWidth:700,borderCollapse:'collapse'}}>
                  <thead><tr style={{background:C.raised}}>{["Date","Vendor","Invoice","Type","Category","Description","Amount",""].map(function(h,i){return<th key={i} style={{padding:'8px 14px',fontSize:8,fontWeight:700,letterSpacing:1.2,textTransform:'uppercase',color:C.dim,textAlign:i===6?'right':'left',borderBottom:'1px solid '+C.border,whiteSpace:'nowrap'}}>{h}</th>;})}</tr></thead>
                  <tbody>
                    {filtered.map(function(e,i){return(
                      <tr key={e.id} style={{background:i%2===0?'transparent':'#0a0a0a',borderLeft:'3px solid '+(e.type==='income'?C.good:C.danger)}}>
                        <td style={{padding:'9px 14px',fontSize:11,color:C.muted,whiteSpace:'nowrap'}}>{e.date||'—'}</td>
                        <td style={{padding:'9px 14px',fontSize:12,fontWeight:500}}>{e.vendor||'—'}</td>
                        <td style={{padding:'9px 14px',fontSize:10,color:C.dim,fontFamily:'monospace'}}>{e.invoiceNum||'—'}</td>
                        <td style={{padding:'9px 14px'}}><span style={{fontSize:9,fontWeight:700,padding:'2px 7px',borderRadius:2,background:e.type==='income'?C.goodBg:C.dangerBg,color:e.type==='income'?C.good:C.danger,border:'1px solid '+(e.type==='income'?C.goodBdr:C.dangerBdr)}}>{e.type.toUpperCase()}</span></td>
                        <td style={{padding:'9px 14px',fontSize:10,color:C.dim}}>{e.category||'—'}</td>
                        <td style={{padding:'9px 14px',fontSize:11,color:C.muted}}>{e.description||'—'}</td>
                        <td style={{padding:'9px 14px',textAlign:'right',fontSize:13,fontWeight:700,color:e.type==='income'?C.good:C.text}}>{e.type==='income'?'+':''}{cur(e.amount)}</td>
                        <td style={{padding:'9px 14px',textAlign:'right'}}><button onClick={function(){deleteEntry(e.id);}} style={{background:'transparent',border:'none',color:C.dim,cursor:'pointer',fontSize:14,padding:'0 4px'}} title="Delete">×</button></td>
                      </tr>
                    );})}
                  </tbody>
                  <tfoot>
                    <tr style={{background:C.raised,borderTop:'2px solid '+C.borderHi}}>
                      <td colSpan={6} style={{padding:'10px 14px',fontSize:11,fontWeight:700,color:C.muted}}>
                        {filter==='all'?'Total':filter==='income'?'Total Income':'Total Expenses'} ({filtered.length} entries)
                      </td>
                      <td style={{padding:'10px 14px',textAlign:'right',fontSize:14,fontWeight:800,color:filter==='income'?C.good:filter==='expense'?C.danger:netCash>=0?C.good:C.danger}}>
                        {filter==='income'?curK(totalIncome):filter==='expense'?curK(totalExpense):curK(Math.abs(netCash))+' '+( netCash>=0?'net':'deficit')}
                      </td>
                      <td style={{padding:'10px 14px'}}/>
                    </tr>
                  </tfoot>
                </table>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ── PASSWORD GATE ─────────────────────────────────────────────────────────
    const PASS = "globs710"; // ← change this to your password
    const AUTH_KEY = "gpi_auth";
    const AUTH_TTL = 7 * 24 * 60 * 60 * 1000; // 7 days

    function PasswordGate({ children }) {
      const [authed, setAuthed] = useState(false);
      const [pw, setPw] = useState("");
      const [err, setErr] = useState(false);
      const [shake, setShake] = useState(false);
      const [loading, setLoading] = useState(true);
      const inputRef = useRef(null);

      useEffect(function() {
        (async function() {
          try {
            const stored = await window.storage.get(AUTH_KEY);
            if (stored) {
              const parsed = JSON.parse(stored.value);
              if (parsed.expiry && Date.now() < parsed.expiry) {
                setAuthed(true);
              } else {
                await window.storage.delete(AUTH_KEY);
              }
            }
          } catch(e) {}
          setLoading(false);
        })();
      }, []);

      useEffect(function() {
        if (!authed && !loading && inputRef.current) {
          setTimeout(function() { inputRef.current && inputRef.current.focus(); }, 100);
        }
      }, [authed, loading]);

      async function handleSubmit() {
        if (pw === PASS) {
          await window.storage.set(AUTH_KEY, JSON.stringify({ expiry: Date.now() + AUTH_TTL }));
          setAuthed(true);
        } else {
          setErr(true);
          setShake(true);
          setPw("");
          setTimeout(function() { setShake(false); }, 500);
          setTimeout(function() { setErr(false); }, 2000);
          if (inputRef.current) inputRef.current.focus();
        }
      }

      function handleKey(e) { if (e.key === "Enter") handleSubmit(); }

      if (loading) return React.createElement("div", {
        style: { height: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: "#080b12" }
      }, React.createElement("div", { style: { width: 6, height: 6, borderRadius: "50%", background: "#2196f3", opacity: 0.6 } }));

      if (authed) return children;

      return React.createElement("div", {
        style: {
          height: "100vh", display: "flex", flexDirection: "column",
          alignItems: "center", justifyContent: "center",
          background: "#080b12", fontFamily: "'DM Mono','Courier New',monospace",
          backgroundImage: "radial-gradient(ellipse at 50% 0%, rgba(33,150,243,0.08) 0%, transparent 60%)"
        }
      },
        React.createElement("style", null, `
          @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(6px)} }
          @keyframes gateFadeIn { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
          .gate-box { animation: gateFadeIn 0.5s ease; }
          .gate-input:focus { outline: none; border-color: #2196f3 !important; box-shadow: 0 0 0 3px rgba(33,150,243,0.15); }
          .gate-btn:hover { background: #1976d2 !important; }
        `),
        React.createElement("div", { className: "gate-box", style: { width: 320, textAlign: "center" } },
          React.createElement("div", { style: { marginBottom: 32 } },
            React.createElement("img", { src: typeof LOGO_DARK !== 'undefined' ? LOGO_DARK : '', alt: "Globs", style: { height: 80, width: "auto", objectFit: "contain", marginBottom: 12 } }),
            React.createElement("div", { style: { fontSize: 11, letterSpacing: 4, textTransform: "uppercase", color: "#3d4559", marginTop: 8 } }, "Price Intelligence")
          ),
          React.createElement("div", {
            style: {
              background: "#0d1117", border: "1px solid " + (err ? "#f4433644" : "#1e2736"),
              borderRadius: 8, padding: "28px 24px",
              animation: shake ? "shake 0.5s ease" : "none",
              transition: "border-color 0.2s, box-shadow 0.2s",
              boxShadow: err ? "0 0 0 1px #f4433622" : "0 0 40px rgba(33,150,243,0.05)"
            }
          },
            React.createElement("div", { style: { fontSize: 10, color: "#3d4559", letterSpacing: 2, textTransform: "uppercase", marginBottom: 18 } }, "Authorized Access Only"),
            React.createElement("input", {
              ref: inputRef,
              className: "gate-input",
              type: "password",
              value: pw,
              onChange: function(e) { setPw(e.target.value); setErr(false); },
              onKeyDown: handleKey,
              placeholder: "Enter password",
              style: {
                width: "100%", boxSizing: "border-box",
                background: "#080b12", border: "1px solid " + (err ? "#f44336" : "#1e2736"),
                borderRadius: 4, padding: "11px 14px",
                color: "#fff", fontSize: 13, letterSpacing: 2,
                fontFamily: "inherit", marginBottom: 14,
                transition: "all 0.2s"
              }
            }),
            React.createElement("button", {
              className: "gate-btn",
              onClick: handleSubmit,
              style: {
                width: "100%", padding: "11px 0", borderRadius: 4,
                background: "#2196f3", border: "none", color: "#fff",
                fontSize: 11, fontWeight: 700, letterSpacing: 2,
                textTransform: "uppercase", cursor: "pointer",
                transition: "background 0.15s"
              }
            }, "Unlock"),
            err && React.createElement("div", { style: { marginTop: 12, fontSize: 11, color: "#f44336", letterSpacing: 0.5 } }, "Incorrect password")
          ),
          React.createElement("div", { style: { marginTop: 20, fontSize: 9, color: "#1e2736", letterSpacing: 2, textTransform: "uppercase" } }, "GLOBS · CONFIDENTIAL")
        )
      );
    }

    // ── RENDER ────────────────────────────────────────────────────────────────
    const rootEl = document.getElementById('root');
    ReactDOM.createRoot(rootEl).render(
      React.createElement(PasswordGate, null, React.createElement(GPI))
    );
  </script>
</body>
</html>
